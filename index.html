<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Ritual">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F1E9">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Meu Ritual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única de app de celular (máx. 560px), navegação fixa embaixo; creme + sálvia + areia, cartões arredondados */
:root{
  --bg:#F6F1E9; --surface:#FFFDF9; --surface-2:#F1E9DD; --sand:#E5D6C2; --sand-2:#D9C6AD;
  --ink:#38382F; --muted:#857C6F; --line:#E8DED0;
  --sage:#5D7256; --sage-2:#A7B49A; --sage-soft:#E6EADD; --on-accent:#FFFDF9;
  --accent:var(--sage); --accent-soft:var(--sage-soft);
  --warn:#9A6A1E; --warn-soft:#F7ECD8; --ok:#4F7046; --ok-soft:#E3EBDB; --danger:#A6483A;
  --g-bracos:#B07D63; --g-pernas:#7A8B67; --g-gluteos:#C0907E; --g-abdomen:#B39B62; --g-cardio:#6D8886;
  --shadow:0 1px 2px rgba(80,60,30,.05),0 10px 26px rgba(80,60,30,.07);
  --scrim:rgba(40,32,20,.38);
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:24px;
  --ilu-skin:#E6C1A6; --ilu-top:#6F8768; --ilu-leg:#4E4842; --ilu-hair:#6B4A35; --ilu-shoe:#B9A68E; --ilu-prop:#8C8275;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1915; --surface:#25221D; --surface-2:#2F2B25; --sand:#4A4135; --sand-2:#5A4F40;
  --ink:#EFE8DC; --muted:#A99F90; --line:#3A342C;
  --sage:#AFC2A2; --sage-2:#6F7F64; --sage-soft:#2D3428; --on-accent:#1B1915;
  --warn:#E2B66A; --warn-soft:#3A2F1D; --ok:#A9CB97; --ok-soft:#28331F; --danger:#E9907F;
  --g-bracos:#D3A189; --g-pernas:#A8BA93; --g-gluteos:#E0B2A0; --g-abdomen:#D8C189; --g-cardio:#9DBAB7;
  --shadow:0 1px 0 rgba(255,255,255,.03); --scrim:rgba(0,0,0,.6); color-scheme:dark;
  --ilu-skin:#DDB497; --ilu-top:#9DB58F; --ilu-leg:#A1978A; --ilu-hair:#C79C78; --ilu-shoe:#E3D5C1; --ilu-prop:#A99F90}}
:root[data-theme="dark"]{
  --bg:#1B1915; --surface:#25221D; --surface-2:#2F2B25; --sand:#4A4135; --sand-2:#5A4F40;
  --ink:#EFE8DC; --muted:#A99F90; --line:#3A342C;
  --sage:#AFC2A2; --sage-2:#6F7F64; --sage-soft:#2D3428; --on-accent:#1B1915;
  --warn:#E2B66A; --warn-soft:#3A2F1D; --ok:#A9CB97; --ok-soft:#28331F; --danger:#E9907F;
  --g-bracos:#D3A189; --g-pernas:#A8BA93; --g-gluteos:#E0B2A0; --g-abdomen:#D8C189; --g-cardio:#9DBAB7;
  --shadow:0 1px 0 rgba(255,255,255,.03); --scrim:rgba(0,0,0,.6); color-scheme:dark;
  --ilu-skin:#DDB497; --ilu-top:#9DB58F; --ilu-leg:#A1978A; --ilu-hair:#C79C78; --ilu-shoe:#E3D5C1; --ilu-prop:#A99F90}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-block:22px calc(108px + env(safe-area-inset-bottom,0px))}
body.has-timer .app{padding-bottom:calc(196px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,p{margin:0}
h1{font:500 2.6rem/1 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
h1 em{color:var(--accent);font-style:italic}
h2{font:500 1.75rem/1.1 var(--f-display);text-wrap:balance}
h3{font:500 1.02rem/1.3 var(--f-body)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:500;margin-bottom:6px}
.muted{color:var(--muted)} .sm{font-size:.85rem} .grow{flex:1;min-width:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font-family:inherit;color:inherit}
button:disabled{opacity:.35;cursor:default}
a{color:var(--accent)}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.top.sub{align-items:center;margin-bottom:14px}
.top.sub h1{font-size:2rem}
.stack{display:grid;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.soft{background:var(--surface-2);box-shadow:none}
.card.sage{background:var(--sage-soft);box-shadow:none}
.section-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:10px 2px -2px}

.btn{appearance:none;border:0;border-radius:999px;padding:11px 20px;font:500 .95rem var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;background:var(--surface-2);color:var(--ink);min-height:46px;transition:transform .12s ease,background .2s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--sand-2)}
.btn.sand{background:var(--sand);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px currentColor}
.btn.block{width:100%} .btn.sm{padding:7px 15px;min-height:36px;font-size:.86rem}
.btn.link{background:none;padding:6px 2px;min-height:0;color:var(--accent)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn.sm{width:34px;height:34px;box-shadow:none;background:var(--surface-2)}
.icon-btn.sm .ic{width:17px;height:17px}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns>.btn{flex:1}

.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 6px;font:500 .86rem var(--f-body);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .ic{width:17px;height:17px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;font:500 .84rem var(--f-body);cursor:pointer;display:inline-flex;gap:7px;align-items:center;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip .n{opacity:.65;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;font-size:.76rem;font-weight:500;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));flex:none;display:inline-block}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.card.soft .bar,.card.sage .bar{background:color-mix(in srgb,var(--surface) 75%,transparent)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.note{font-size:.86rem;padding:11px 14px;border-radius:14px;background:var(--surface-2)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;padding:30px 18px;display:grid;gap:10px;justify-items:center}
.empty .ic{width:32px;height:32px;color:var(--accent)}
.skel{height:90px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.lvl{display:inline-flex;gap:3px;vertical-align:middle}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--sand)}
.lvl i.on{background:var(--accent)}

/* navegação */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:auto;display:flex;justify-content:space-around}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 16px;border-radius:16px;min-width:78px}
nav.tabs a .ic{width:23px;height:23px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a[aria-current="page"] .ic{stroke-width:1.9}

/* home */
.hero{display:grid;grid-template-columns:1fr 110px;gap:14px;align-items:center}
.hero .grow{display:grid;gap:6px;justify-items:start}
.thumb{width:110px;height:110px;border-radius:18px;object-fit:cover;background:var(--surface);display:block}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rg{display:grid;justify-items:center;gap:6px;text-align:center}
.rg span{font-size:.8rem;color:var(--muted)}
.sync{font-size:.76rem;color:var(--muted);text-align:center;margin-top:18px;display:flex;justify-content:center;align-items:center;gap:6px}
.sync .dot{--c:var(--sand-2)} .sync.ok .dot{--c:var(--ok)} .sync.erro .dot{--c:var(--danger)}
.per-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:6px 0;border:0;background:none;width:100%;text-align:left;cursor:pointer;font:inherit}
.per-row .ic{color:var(--muted)}

/* anéis */
.ring-p{position:relative;flex:none}
.ring-p svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-p circle{fill:none}
.ring-p .trk{stroke:var(--surface-2)}
.card.soft .ring-p .trk,.card.sage .ring-p .trk{stroke:color-mix(in srgb,var(--surface) 70%,transparent)}
.ring-p .prog{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring-p span{position:absolute;inset:0;display:grid;place-items:center;font:500 1.15rem var(--f-display);font-variant-numeric:tabular-nums}

/* listas */
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-radius:18px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);font:inherit}
.item .ic{color:var(--muted)}
.item p{margin-top:1px}
.item img.th,.th{width:58px;height:58px;border-radius:14px;object-fit:cover;flex:none;background:var(--surface-2)}
.obs{font-size:.85rem;color:var(--muted);font-style:italic;margin-top:4px}
.list{display:grid;gap:10px}
.grp-title{display:flex;align-items:center;gap:8px;font-size:.74rem;letter-spacing:.13em;text-transform:uppercase;font-weight:500;color:var(--muted);margin:8px 2px 0}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between}

/* treinos */
.tiles-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gtile{border:0;background:var(--surface-2);border-radius:22px;padding:18px 12px 14px;display:grid;justify-items:center;gap:8px;cursor:pointer;font:inherit;color:var(--ink)}
.gtile .ic{width:44px;height:44px;stroke-width:1.1;color:var(--ink)}
.gtile span{font-size:.92rem}
.gtile small{color:var(--muted);font-size:.76rem}
.gtile.wide{grid-column:1/-1;background:var(--sage);color:var(--on-accent)}
.gtile.wide .ic,.gtile.wide small{color:var(--on-accent)}
.treino{display:grid;gap:12px}
.treino h2{font-size:1.55rem}
.thumbs{display:flex;gap:6px}
.thumbs img{width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--surface-2)}
.thumbs span{width:46px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:.8rem;color:var(--muted)}
.daypills{display:flex;gap:4px;flex-wrap:wrap}
.daypill{font-size:.72rem;font-weight:500;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.daypill.on{background:var(--sage-soft);color:var(--accent)}

/* demonstração */
.demo{position:relative;border-radius:22px;overflow:hidden;background:var(--surface-2);aspect-ratio:3/2;max-width:100%}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo img.f1{animation:swap 2.8s ease-in-out infinite}
@keyframes swap{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
.demo .badge{position:absolute;right:10px;bottom:10px;background:color-mix(in srgb,#1d1a15 60%,transparent);color:#fff;font-size:.68rem;letter-spacing:.1em;padding:3px 8px;border-radius:8px;font-weight:600}
.demo .credit{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,#1d1a15 45%,transparent);color:#fff;font-size:.62rem;padding:2px 7px;border-radius:7px}
.demo.none{display:grid;place-items:center;color:var(--muted)}
.demo.none .ic{width:56px;height:56px;stroke-width:1}
.howto{display:grid;gap:10px}
.howto ol{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:p}
.howto li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;counter-increment:p}
.howto li::before{content:counter(p);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.8rem;font-weight:600}
.howto ul{margin:0;padding-left:18px;display:grid;gap:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}

/* sessão */
.sess-top{display:grid;gap:10px;margin-bottom:14px}
.segbar{display:flex;gap:4px}
.segbar button{flex:1;height:6px;border:0;border-radius:9px;background:var(--sand);cursor:pointer;padding:0}
.segbar button.done{background:var(--sage-2)}
.segbar button.cur{background:var(--accent)}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:minmax(60px,auto) 1fr auto;align-items:center;gap:8px;padding:7px 7px 7px 14px;border-radius:18px;background:var(--surface-2);transition:background .25s}
.set.feito{background:var(--sage-soft)}
.set .n{display:grid;gap:3px;justify-items:start;font-weight:500;font-size:.82rem;color:var(--muted)}
.delta{font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:99px}
.delta.menos{background:var(--warn-soft);color:var(--warn)}
.delta.mais{background:var(--ok-soft);color:var(--ok)}
.stepper{display:flex;align-items:center;justify-content:center;gap:2px}
.stepper button{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);font-size:1.2rem;cursor:pointer;display:grid;place-items:center}
.reps-in{width:50px;text-align:center;font:500 1.5rem var(--f-display);border:0;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;-moz-appearance:textfield;padding:0}
.reps-in::-webkit-inner-spin-button,.reps-in::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.un{font-size:.72rem;color:var(--muted);margin-left:2px}
.check{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--sand-2);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:transparent;transition:background .2s,border-color .2s,color .2s}
.check .ic{stroke-width:2.2}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:pop .28s ease}
@keyframes pop{50%{transform:scale(1.12)}}
.sess-nav{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:16px}

/* cronômetro */
#timer{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:30;pointer-events:none;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.timer{pointer-events:auto;max-width:540px;margin:auto;background:var(--ink);color:var(--bg);border-radius:24px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 34px rgba(40,30,15,.28);animation:up .25s ease}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.timer.done{background:var(--accent);color:var(--on-accent);animation:pulse .9s ease 3}
@keyframes pulse{50%{transform:scale(1.03)}}
.tring{position:relative;width:58px;height:58px;flex:none}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring circle{fill:none;stroke-width:4}
.tring .trk{stroke:color-mix(in srgb,currentColor 18%,transparent)}
.tring .prog{stroke:var(--sage-2);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.timer.done .tring .prog,.tbig.done .tring .prog{stroke:currentColor}
.tring span{position:absolute;inset:0;display:grid;place-items:center;font:500 1.05rem var(--f-body);font-variant-numeric:tabular-nums}
.tinfo{flex:1;min-width:0;display:grid}
.tinfo b{font-size:.92rem;font-weight:500}
.tinfo small{font-size:.76rem;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtns{display:flex;gap:5px}
.tbtns button{width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in srgb,currentColor 14%,transparent);display:grid;place-items:center;font:600 .74rem var(--f-body);cursor:pointer;padding:0}
.tbtns .ic{width:18px;height:18px}
.tbig{background:var(--surface-2);border-radius:var(--r);padding:16px;display:grid;justify-items:center;gap:10px;text-align:center}
.tbig .tring{width:150px;height:150px}
.tbig .tring circle{stroke-width:5}
.tbig .tring .trk{stroke:var(--sand)}
.tbig .tring .prog{stroke:var(--accent)}
.tbig .tring span{font:500 2.6rem var(--f-display)}
.tbig .tbtns button{width:46px;height:46px;background:var(--surface)}
.tbig.done{background:var(--sage-soft)}
.tbig .lbl{font-size:.82rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

/* skincare */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:0;background:transparent;border-radius:16px;padding:8px 0 7px;display:grid;justify-items:center;gap:3px;cursor:pointer;font:inherit}
.day span{font-size:.72rem;color:var(--muted)}
.day b{font-variant-numeric:tabular-nums;font-weight:500;font-size:1.02rem}
.day[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.day[aria-pressed="true"] span{color:inherit;opacity:.85}
.day i{width:6px;height:6px;border-radius:50%;background:var(--sand)}
.day i.half{background:var(--sage-2)}
.day i.full{background:var(--sage)}
.day[aria-pressed="true"] i{background:color-mix(in srgb,var(--on-accent) 35%,transparent)}
.day[aria-pressed="true"] i.full{background:var(--on-accent)}
.day.today:not([aria-pressed="true"]) b{color:var(--accent)}
.steps{display:grid}
.step{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;font:inherit}
.steps .step:last-child{border-bottom:0}
.step:disabled{opacity:1;cursor:default}
.box{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--sand-2);display:grid;place-items:center;color:transparent;transition:.2s;flex:none;background:var(--surface)}
.box .ic{width:15px;height:15px;stroke-width:2.4}
.box.sq{border-radius:8px;width:22px;height:22px}
[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step[aria-checked="true"] .nome{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.step:disabled .box{border-style:dashed}
.nome{font-weight:500}
.ord{font:500 1.3rem/1 var(--f-display);color:var(--muted);min-width:18px;text-align:right}
.step.edit{cursor:default}
.ctl{display:flex;gap:4px}

/* produtos */
.pimg{border-radius:16px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;flex:none;position:relative}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg svg{width:62%;height:78%}
.pimg[data-big]{width:100%;aspect-ratio:4/3}
.pimg[data-big] svg{width:34%}
.pimg .pb{fill:var(--pt,var(--sand))} .pimg .pc{fill:var(--sand-2)} .pimg .pl{fill:var(--surface);opacity:.85}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pcard{border:0;background:var(--surface);border-radius:22px;padding:10px 10px 14px;box-shadow:var(--shadow);display:grid;gap:8px;text-align:left;cursor:pointer;font:inherit;min-width:0}
.pcard .pimg{width:100%;aspect-ratio:1/1}
.pcard h3{font-size:.95rem;overflow-wrap:anywhere}
.pcard p{font-size:.78rem;color:var(--muted)}
.pcard .tag{font-size:.74rem}
.pcard.bought{opacity:.6}
.photo-field{display:flex;gap:12px;align-items:center}
.photo-field .pimg{width:84px;height:84px}

/* cabelo */
.next{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.tmark{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:500 1.7rem var(--f-display);background:var(--surface);color:var(--accent)}
.seq{display:flex;gap:6px;flex-wrap:wrap}
.seq span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:600;background:var(--surface);color:var(--muted)}
.seq span.cur{background:var(--accent);color:var(--on-accent)}
.wash{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;font:inherit}
.wash:last-child{border-bottom:0}
.wash .tmark{width:40px;height:40px;font-size:1.15rem;background:var(--surface-2)}
.diary{display:grid;gap:18px;position:relative}
.diary .mes{font:500 1.35rem var(--f-display);color:var(--muted);margin:4px 2px -6px}
.entry{border:0;background:var(--surface);border-radius:26px;padding:10px;box-shadow:var(--shadow);display:grid;grid-template-columns:120px 1fr;gap:14px;text-align:left;cursor:pointer;font:inherit;align-items:start}
.entry .ph{width:120px;aspect-ratio:4/5;border-radius:18px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.entry .ph .ic{width:30px;height:30px}
.entry .meta{padding:6px 4px 4px 0;display:grid;gap:6px;min-width:0}
.entry .date{font:500 1.35rem/1 var(--f-display)}
.obsl{display:grid;gap:3px;font-size:.82rem}
.obsl div{display:flex;gap:6px} .obsl b{font-weight:500;color:var(--muted);flex:none}
.obsl span{overflow-wrap:anywhere}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp figure{margin:0;display:grid;gap:8px;align-content:start}
.cmp img,.cmp .ph{width:100%;aspect-ratio:4/5;border-radius:18px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center}
.cmp figcaption{font:500 1.2rem var(--f-display)}

/* calendário */
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-days{display:grid;gap:2px}
.cal-day{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.cal-day:last-child{border-bottom:0}
.cal-day .d{display:grid;justify-items:center;line-height:1.1}
.cal-day .d span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.cal-day .d b{font:500 1.45rem var(--f-display)}
.cal-day.today .d b{color:var(--accent)}
.cal-day .s{display:grid;gap:4px}
.cal-day .done{display:flex;align-items:center;gap:8px;font-size:.9rem}
.cal-day .done i{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.cal-day .done i .ic{width:13px;height:13px;stroke-width:2.4}
.cal-day .none{font-size:.85rem;color:var(--muted)}
.habit{display:grid;grid-template-columns:auto repeat(12,1fr);gap:4px;align-items:center}
.habit span{font-size:.62rem;color:var(--muted);text-align:right;padding-right:4px}
.habit button{border:0;padding:0;aspect-ratio:1;border-radius:50%;background:var(--surface-2);cursor:pointer;max-width:22px;justify-self:center;width:100%}
.habit button.on{background:var(--sage-2)}
.habit button.on2{background:var(--sage)}
.habit button.sel{box-shadow:0 0 0 1.5px var(--accent)}
.habit button.fut{opacity:.35}

/* evolução treinos */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:2px}
.tile b{font:500 2.1rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font-size:.8rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:10px;overflow:visible}
.chart text{fill:var(--muted);font:500 10px var(--f-body)}
.chart .bar-r{fill:var(--sage-2)}
.chart .bar-r.cur{fill:var(--accent)}
.chart .meta{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1}
.chart .plan{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.chart .exec{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.1}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .val{fill:var(--ink);font-weight:600}
.grow-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.grow-row:last-child{border-bottom:0}
.hist{display:grid;gap:8px}
.hrow{border:0;background:var(--surface);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);text-align:left;width:100%;cursor:pointer;font:inherit;display:grid;gap:8px}
.hrow .pct{font-weight:600;font-variant-numeric:tabular-nums}
.hdet{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.hdet div{display:flex;justify-content:space-between;gap:10px;font-size:.85rem}
.hdet span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.legend-l{display:flex;gap:14px;font-size:.76rem;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend-l i{display:inline-block;width:14px;height:0;border-top:2.5px solid var(--accent);vertical-align:middle;margin-right:5px}
.legend-l i.p{border-top:1.5px dashed var(--muted)}

#sheet{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:auto;background:var(--surface);border-radius:28px 28px 0 0;max-height:92%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.on .scrim{opacity:1}
#sheet.on .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 2px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 20px 8px}
.sheet-head .icon-btn{box-shadow:none;background:var(--surface-2)}
.sheet-body{overflow:auto;padding:6px 20px 26px;display:grid;gap:16px;overscroll-behavior:contain}
.f{display:grid;gap:7px;font-size:.82rem;font-weight:500;color:var(--muted)}
.t{font:400 1rem var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:12px 14px;width:100%;min-width:0}
.t:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea.t{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ordlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ordlist li{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;padding:6px 6px 6px 12px;color:var(--ink);font-size:.9rem}
.picklist{display:grid;gap:4px}
.pick{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 4px;text-align:left;cursor:pointer;font:400 .95rem var(--f-body);color:var(--ink);width:100%}
.pick small{margin-left:auto;color:var(--muted)}
.pick .pimg{width:40px;height:40px;border-radius:10px}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum-grid div{background:var(--surface-2);border-radius:16px;padding:12px;display:grid;gap:2px;text-align:center}
.sum-grid b{font:500 1.7rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.sum-grid span{font-size:.74rem;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:500;font-size:.9rem;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.has-timer #toast{bottom:calc(166px + env(safe-area-inset-bottom,0px))}

.reps-in,.tile b,.ring-p span,.tring span,.sum-grid b,.cal-day .d b,.ord,.entry .date,.tmark,.cmp figcaption,h1,h2{font-variant-numeric:lining-nums tabular-nums}
.demo.ilu{background:linear-gradient(180deg,var(--surface-2),color-mix(in srgb,var(--surface-2) 70%,var(--sand)))}
.demo.ilu svg,.th.ilu svg,.thumb.ilu svg{width:100%;height:100%;display:block}
.th.ilu,.thumb.ilu,.tb.ilu{background:var(--surface-2);overflow:hidden;display:block}
.thumbs .tb{width:46px;height:46px;border-radius:12px;flex:none}
.tb.ilu svg{width:100%;height:100%;display:block}
.ilu polyline,.ilu line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ilu .sk{stroke:var(--ilu-skin)} .ilu .lg{stroke:var(--ilu-leg)} .ilu .tp{stroke:var(--ilu-top)} .ilu .sh{stroke:var(--ilu-shoe)}
.ilu .pr{stroke:var(--ilu-prop)} .ilu .fl{stroke:var(--line)} .ilu .far{opacity:.5}
.ilu .fsk{fill:var(--ilu-skin)} .ilu .fhr{fill:var(--ilu-hair)} .ilu .flg{fill:var(--ilu-leg)} .ilu .ftp{fill:var(--ilu-top)} .ilu .fpr{fill:var(--ilu-prop)}
.box[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag .ic{width:14px;height:14px}
.money{font:500 1.15rem var(--f-display);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.chip-st{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip-st.late{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.chip-st.soon{background:var(--warn-soft);color:var(--warn)}
.chip-st.ok{background:var(--ok-soft);color:var(--ok)}
.handle{touch-action:none;cursor:grab;display:grid;place-items:center;width:36px;height:44px;flex:none;color:var(--muted);border:0;background:none;padding:0}
.handle .ic{fill:currentColor;stroke:none;width:22px;height:22px}
[data-sort]{transition:transform .16s ease}
[data-sort].dragging{transition:none;position:relative;z-index:6;box-shadow:0 12px 30px rgba(60,40,20,.22);opacity:.96}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:370px){h1{font-size:2.2rem}.tbtns button{width:36px;height:36px}.stepper button{width:32px;height:32px}.entry{grid-template-columns:96px 1fr}.entry .ph{width:96px}}
</style>

const IDB = {
  db: null,

};
const Store = {

    try { const c = JSON.parse(localStorage.getItem(CACHE) || '{}'); if (c && typeof c === 'object') this.docs = c; } catch (e) {}
  },
  get(id) { return this.docs[id]; },
  ids(prefix) { return Object.keys(this.docs).filter(k => k.startsWith(prefix)); },
  put(id, data) { data.savedAt = Date.now(); this.docs[id] = data; this.cache(); this.schedule(id); this.emit(); },
  remove(id) { delete this.docs[id]; this.dirty.delete(id); this.cache(); this.emit(); if (this.col) this.col.doc(id).delete().catch(() => {}); },
  cache() { clearTimeout(this.cacheT); this.cacheT = setTimeout(() => this.cacheNow(), 250); },
  async cacheNow() {
    clearTimeout(this.cacheT);
    try { await IDB.set('docs', this.docs); try { localStorage.removeItem(CACHE); } catch (e) {} return; } catch (e) {}
    try { localStorage.setItem(CACHE, JSON.stringify(this.docs)); }
    catch (e) { if (this.mode === 'local') { this.setSync('cheioLocal'); toast('Não consegui salvar no aparelho. Baixe um backup em Ajustes.'); } }
  },
  on(fn) { this.subs.add(fn); },
  emit() { this.subs.forEach(f => f()); },
  setSync(s) { this.sync = s; App.syncBadge(); },
  async connect() {
    const local = () => { this.mode = 'local'; this.ready = true; this.setSync('local'); this.emit(); };
    if (!window.claude || !window.claude.use) return local();
    let db, user;
    try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { return local(); }
    if (!db || !user) return local();
    let id = null;
    try { id = await user.id(); } catch (e) {}
    if (!id) return local();
    this.col = db.collection('data/users/' + id);

/* ---------- Fotos ----------
   Na conta: arquivo enviado ao armazenamento do app ({id, url}). Sem conta: imagem reduzida
   guardada no próprio registro ({url: data:...}). */
const Fotos = {
  _a: undefined,
  async assets() {
    if (this._a === undefined) { try { this._a = window.claude && window.claude.use ? await window.claude.use('assets') : null; } catch (e) { this._a = null; } }
    return this._a;
  },
  pick() {
    return new Promise(res => {
      const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
      i.onchange = () => res(i.files && i.files[0] || null);
      i.click();
    });
  },
  async canvas(file, max) {
    const url = URL.createObjectURL(file), img = new Image();
    await new Promise((ok, err) => { img.onload = ok; img.onerror = err; img.src = url; });
    const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    return c;
  },
  async salvar(file) {
    const a = await this.assets();
    if (a) {
      try {
        const c = await this.canvas(file, 1400);
        const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
        const up = await a.upload(blob, {type: 'image/jpeg'});
        return {id: up.id, url: up.url};

    // ponytail: foto embutida no registro (~40 KB); limite de 256 KB por documento na conta
    const c = await this.canvas(file, 560);
    return {url: c.toDataURL('image/jpeg', .7)};
  },
  apagar(f) { if (f && f.id) this.assets().then(a => a && a.delete(f.id).catch(() => {})); }
};

/* ---------- Lembretes ----------

   ponytail: sem servidor de push não há notificação com o app fechado; o .ics cobre isso. */
const icsTxt = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');

function lembreteCalendario({id, titulo, nota, quando, antesMin = 0}) {

    'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');

/* ---------- Cronômetro de descanso: grande dentro do treino, compacto nas outras telas ---------- */
const Timer = {
  on: false, done: false, paused: false, total: 0, left: 0, endsAt: 0, label: '', iv: 0, hideT: 0,
  start(sec, label) {

    clearInterval(this.iv); this.iv = setInterval(() => this.tick(), 250);

  tick() {

    if (l <= 0) this.finish();
  },
  finish() {
    this.done = true; clearInterval(this.iv);
    Sound.chime(); buzz([220, 120, 220, 120, 220]);
    this.paint();
    this.hideT = setTimeout(() => this.stop(), 8000);
  },
  toggle() {
    if (this.done) return;
    if (this.paused) { this.endsAt = Date.now() + this.left * 1000; this.paused = false; }
    else { this.left = Math.max(0, Math.ceil((this.endsAt - Date.now()) / 1000)); this.paused = true; }
    this.paint();
  },
  restart() { this.start(this.total, this.label); },
  add(s) {
    if (this.done) return;
    if (this.paused) this.left = Math.max(1, this.left + s);
    else { this.endsAt = Math.max(Date.now() + 1000, this.endsAt + s * 1000); this.left = Math.ceil((this.endsAt - Date.now()) / 1000); }
    this.total = Math.max(this.total, this.left);
    this.paintTime();
  },
  stop() { clearTimeout(this.hideT); clearInterval(this.iv); this.on = false; this.paint(); if ($('#timerInline')) App.queue(); },
  ringHtml(r) {
    const C = 2 * Math.PI * r, s = r * 2 + 8, pct = this.done ? 1 : this.left / this.total;
    return `<div class="tring"><svg viewBox="0 0 ${s} ${s}"><circle class="trk" cx="${s/2}" cy="${s/2}" r="${r}"/><circle class="prog" id="tProg" data-c="${C}" cx="${s/2}" cy="${s/2}" r="${r}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(2)}"/></svg>
      <span id="tTime">${this.done ? ic('check') : fmtClock(this.left)}</span></div>`;
  },
  paint() {
    const root = $('#timer'), inline = $('#timerInline');
    document.body.classList.toggle('has-timer', this.on && !inline);
    if (inline) {
      root.innerHTML = '';
      inline.innerHTML = !this.on ? '' : `<div class="tbig ${this.done ? 'done' : ''}" role="timer" aria-label="Cronômetro de descanso">
        <span class="lbl">${this.done ? 'Descanso concluído' : this.paused ? 'Pausado' : 'Descanso'}</span>${this.ringHtml(56)}
        <span class="sm muted">${this.done ? 'Bora para a próxima série' : esc(this.label)}</span>
        ${this.done ? `<button class="btn sand block" data-act="tmStop">Fechar</button>` : `<div class="tbtns"><button data-act="tmAdd" aria-label="Mais 15 segundos">+15</button>
          <button data-act="tmToggle" aria-label="${this.paused ? 'Continuar' : 'Pausar'}">${ic(this.paused ? 'play' : 'pause')}</button>
          <button data-act="tmRestart" aria-label="Reiniciar">${ic('reset')}</button></div>
          <button class="btn sand block" data-act="tmStop">${ic('skip')} Pular descanso</button>`}</div>`;
      return;
    }
    if (!this.on) { root.innerHTML = ''; return; }
    root.innerHTML = `<div class="timer ${this.done ? 'done' : ''}" role="timer" aria-label="Cronômetro de descanso">${this.ringHtml(25)}
      <div class="tinfo"><b>${this.done ? 'Descanso concluído' : this.paused ? 'Pausado' : 'Descanso'}</b><small>${this.done ? 'Bora para a próxima série' : esc(this.label)}</small></div>
      <div class="tbtns">${this.done ? `<button data-act="tmStop" aria-label="Fechar">${ic('x')}</button>`
        : `<button data-act="tmAdd" aria-label="Mais 15 segundos">+15</button>
           <button data-act="tmToggle" aria-label="${this.paused ? 'Continuar' : 'Pausar'}">${ic(this.paused ? 'play' : 'pause')}</button>
           <button data-act="tmRestart" aria-label="Reiniciar">${ic('reset')}</button>
           <button data-act="tmStop" aria-label="Pular descanso">${ic('skip')}</button>`}</div></div>`;
  },
  paintTime() {
    const t = $('#tTime'), p = $('#tProg');
    if (!t || this.done) return;
    t.textContent = fmtClock(this.left);
    if (p) { const C = +p.dataset.c; p.style.strokeDashoffset = (C * (1 - this.left / this.total)).toFixed(2); }
  }
};

/* ---------- App / roteador ---------- */
const App = {
  mods: [], routes: {}, actions: {}, ui: {}, last: '', raf: 0,
  areas: {beleza: {label: 'Beleza', icon: 'leaf', eyebrow: 'Pele, cabelo e produtos'}},
  hooks: {usos: [], removerProduto: [], migrar: [], semear: [], avisos: []},
  /* primeira abertura: carrega suas rotinas. Só com resposta definitiva do armazenamento,
     para nunca sobrescrever dados da conta que ainda não chegaram. */
  semear() {
    if (!Store.ready || !(Store.sync === 'local' || Store.sync === 'ok')) return;
    const p = Store.get('perfil') || {};
    if (p.semeado || Store.get('treinos') || Store.get('skincare')) return;

  },
  module(m) {

  },
  route() { const h = location.hash.slice(1); return this.routes[h] ? h : 'hoje'; },
  go(r) { if (this.route() === r && location.hash) this.render(); else location.hash = r; },
  queue() { clearTimeout(this.raf); this.raf = setTimeout(() => this.render(), 0); },
  navItems() {
    const out = [{route: 'hoje', label: 'Hoje', icon: 'home'}], seen = {};
    for (const m of this.mods) {
      if (!m.nav) continue;

    document.body.className = document.body.className.replace(/\bmod-\S+/g, '').trim() + ' mod-' + m.id;
    const main = $('#main');
    if (r !== this.last) { main.classList.remove('view'); void main.offsetWidth; main.classList.add('view'); }
    let html = def.view();

        <div class="seg" role="group" aria-label="Seções de ${a.label}" style="margin-bottom:16px">${irmaos.map(x => `<button aria-pressed="${x.nav.route === r}" data-act="go" data-r="${x.nav.route}">${x.nav.label}</button>`).join('')}</div>${html}`;
    }
    main.innerHTML = html;
    const navR = (m.nav && m.nav.area) || m.navAs || r;
    $('#nav').innerHTML = this.navItems().map(n => `<a href="#${n.route}" ${(n.area || n.route) === navR ? 'aria-current="page"' : ''}>${ic(n.icon)}<span>${n.label}</span></a>`).join('');
    if (r !== this.last) { window.scrollTo(0, 0); this.last = r; }

      ok: ['ok', 'Salvo na sua conta'], offline: ['erro', 'Sem conexão — salvo neste aparelho'],
      erro: ['erro', 'Não deu para salvar na conta agora — tentando de novo'], cheio: ['erro', 'Espaço da conta cheio — faça um backup'],
      cheioLocal: ['erro', 'Espaço do aparelho cheio — baixe um backup']

/* Delegação de eventos: data-act (clique), data-chg (mudança), data-bind (campo de folha) */
document.addEventListener('click', e => {
  Sound.unlock();
  const el = e.target.closest('[data-act]');

});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.bind && Sheet.st) Sheet.st[el.dataset.bind] = el.type === 'checkbox' ? el.checked : el.value;
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]');
  if (el) { const fn = App.actions[el.dataset.chg]; fn && fn(el.dataset, el, e); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Sheet.cfg) Sheet.close(); });

/* Arrastar para reordenar: lista com data-sort-act, itens com data-sort e uma alça .handle.
   Ao soltar chama App.actions[sortAct]({from, to}). */
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle'), item = h && h.closest('[data-sort]'), list = item && item.parentElement;
  if (!list || !list.dataset.sortAct) return;
  e.preventDefault();
  const items = [...list.children].filter(x => x.hasAttribute('data-sort'));
  const from = items.indexOf(item), y0 = e.clientY, R = items.map(x => x.getBoundingClientRect());
  const passo = items.length > 1 ? R[1].top - R[0].top : R[0].height;
  let to = from;
  item.classList.add('dragging');
  try { h.setPointerCapture(e.pointerId); } catch (er) {}
  const move = ev => {
    const dy = ev.clientY - y0, cy = R[from].top + R[from].height / 2 + dy;
    item.style.transform = `translateY(${dy}px)`;
    to = from;
    items.forEach((x, i) => { const mid = R[i].top + R[i].height / 2; if (i > from && cy > mid) to = Math.max(to, i); if (i < from && cy < mid) to = Math.min(to, i); });
    items.forEach((x, i) => { if (i === from) return; const s = from < to && i > from && i <= to ? -passo : from > to && i < from && i >= to ? passo : 0; x.style.transform = s ? `translateY(${s}px)` : ''; });
  };
  const up = () => {
    h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
    items.forEach(x => { x.style.transform = ''; }); item.classList.remove('dragging');
    if (to !== from) { buzz(10); App.actions[list.dataset.sortAct]({from, to}); }
  };
  h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
});
const mover = (a, from, to) => { const [x] = a.splice(from, 1); a.splice(to, 0, x); };

Object.assign(App.actions, {
  sheetClose: () => Sheet.close(),
  sheetOk: () => { const f = Sheet.cfg && Sheet.cfg.onOk; Sheet.close(); f && f(); },
  go: d => { if (d.per) App.ui.kPer = d.per; if (d.dia != null) App.ui.kDia = +d.dia; if (d.tab) App.ui.tTab = d.tab; App.go(d.r); },
  tmToggle: () => Timer.toggle(), tmRestart: () => Timer.restart(), tmAdd: () => Timer.add(15), tmStop: () => Timer.stop(),
  ajustes: () => openAjustes(),
  fotoPick: () => {
    const st = Sheet.st, pr = Fotos.pick();
    pr.then(async file => {
      if (!file || Sheet.st !== st) return;
      st.enviando = true; Sheet.refresh();
      try {
        const f = await Fotos.salvar(file);
        st._up = st._up || [];
        if (st.foto && st.foto.id && st._up.includes(st.foto.id)) Fotos.apagar(st.foto); // só apaga a que subiu nesta edição
        if (f.id) st._up.push(f.id);
        st.foto = f;
      }
      catch (e) { toast('Não consegui abrir essa imagem. Tente outra.'); }
      st.enviando = false; if (Sheet.st === st) Sheet.refresh();
    });
  },
  fotoTirar: () => { Sheet.st.foto = null; Sheet.refresh(); },
  fpTipo: d => { const st = Sheet.st; st.tipo = d.t; st.cat = catsDe(d.t)[0]; Sheet.refresh(); },
  fpCat: d => { Sheet.st.cat = d.c; Sheet.refresh(); },
  fpSalvar: () => {
    const st = Sheet.st, nome = (st.nome || '').trim();
    if (!nome) { st.err = 'Dê um nome ao produto.'; return Sheet.refresh(); }
    if (st.enviando) { st.err = 'Espere a foto terminar de enviar.'; return Sheet.refresh(); }
    const p = {id: st.id || uid(), nome, marca: (st.marca || '').trim(), cat: st.cat, finalidade: (st.finalidade || '').trim(), obs: (st.obs || '').trim(), foto: st.foto || null};
    const dup = Produtos.duplicado(p);
    if (dup) { st.err = `"${dup.nome}"${dup.marca ? ' de ' + dup.marca : ''} já está na sua coleção.`; return Sheet.refresh(); }
    const novo = !Produtos.get(p.id), onSave = st.onSave;
    Produtos.salvar(p); Sheet.close();
    if (onSave) onSave(p); else toast(novo ? 'Produto adicionado à coleção' : 'Produto atualizado');
  },
  fpExcluir: () => {
    const p = Produtos.get(Sheet.st.id); if (!p) return;
    const usos = Produtos.usos(p.id);
    Sheet.confirm({title: 'Excluir produto?', text: `"${p.nome}" sai da sua coleção${usos.length ? ' e de: ' + usos.join(', ') : ''}.`, ok: 'Excluir', danger: true,
      onOk: () => { Produtos.excluir(p.id); toast('Produto excluído'); }});
  }
});

/* ---------- Tema: automático (segue o aparelho), claro ou escuro ---------- */
const TEMA_HOST = document.documentElement.getAttribute('data-theme');
function aplicarTema() {
  const t = (Store.get('perfil') || {}).tema, el = document.documentElement;

  if (v) el.setAttribute('data-theme', v); else el.removeAttribute('data-theme');

function restaurar(txt) {
  let o; try { o = JSON.parse(txt || ''); } catch (e) {}
  const docs = o && o.app === 'meu-ritual' && o.docs && typeof o.docs === 'object' ? o.docs : null;
  if (!docs) {
    if (Sheet.st && 'backup' in Sheet.st) { Sheet.st.err = 'Isso não é um backup do Meu Ritual. Use o arquivo baixado em "Baixar backup" ou o texto completo de "Copiar backup".'; Sheet.refresh(); }
    else toast('Esse arquivo não é um backup do Meu Ritual');
    return;
  }
  Sheet.confirm({title: 'Restaurar backup?', text: 'Os dados atuais serão trocados pelos do backup.', ok: 'Restaurar', onOk: () => {
    Object.keys(Store.docs).forEach(k => { if (!(k in docs)) Store.remove(k); });
    Object.entries(docs).forEach(([k, v]) => { if (v && typeof v === 'object') Store.put(k, clone(v)); });
    Store.cacheNow(); toast('Backup restaurado'); App.go('hoje');
  }});
}

Object.assign(App.actions, {
  ajNotif: async () => { try { const r = await Notification.requestPermission(); toast(r === 'granted' ? 'Avisos ativados' : 'Avisos não permitidos — dá para mudar nos Ajustes do iPhone'); } catch (e) { toast('Este aparelho não permite avisos aqui'); } Sheet.refresh(); },
  ajTema: d => { const p = Store.get('perfil') || {}; p.tema = d.t; Store.put('perfil', p); aplicarTema(); Sheet.refresh(); },
  temaRapido: () => {
    const escuro = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    const p = Store.get('perfil') || {}; p.tema = escuro ? 'claro' : 'escuro'; Store.put('perfil', p); aplicarTema();
  },
  ajSalvar: () => { const p = Store.get('perfil') || {}; p.nome = (Sheet.st.nome || '').trim(); Store.put('perfil', p); Sheet.close(); toast('Nome salvo'); },
  ajCopiar: async () => {
    const txt = JSON.stringify({app: 'meu-ritual', v: 1, docs: Store.docs});
    try { await navigator.clipboard.writeText(txt); toast('Backup copiado'); }
    catch (e) { Sheet.st.backup = txt; Sheet.refresh(); const ta = $('#aj-backup'); ta.focus(); ta.select(); toast('Selecionei o backup: copie com o menu do aparelho'); }
  },
  ajRestaurar: () => restaurar(Sheet.st.backup),
  ajBaixar: () => {
    const txt = JSON.stringify({app: 'meu-ritual', v: 1, docs: Store.docs});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], {type: 'application/json'}));
    a.download = `meu-ritual-backup-${dkey()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    const p = Store.get('perfil') || {}; p.ultimoBackup = Date.now(); Store.put('perfil', p);
    toast('Backup gerado — salve em Arquivos ou iCloud');
  },
  ajArquivo: () => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = () => { const f = i.files && i.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => restaurar(String(r.result)); r.readAsText(f); };
    i.click();
  },
  ajApagar: () => Sheet.confirm({title: 'Apagar tudo?', text: 'Treinos, histórico, rotinas, produtos e diário do cabelo serão apagados. Isso não pode ser desfeito — copie um backup antes, se quiser guardar.', ok: 'Apagar tudo', danger: true,
    onOk: () => { Object.keys(Store.docs).forEach(k => Store.remove(k)); Store.put('perfil', {semeado: true}); Timer.stop(); toast('Dados apagados'); App.go('hoje'); }})
});

/* =====================================================================
   ILUSTRAÇÕES ANIMADAS (desenhadas no próprio app, figura feminina em traço)
   Cada exercício = duas posições (a: início, b: fim) da mesma figura; o app anima entre elas.
   Ângulos em graus: 0 = para baixo, 90 = para a frente (direita), 180 = para cima.
   t = inclinação do tronco (0 = em pé). h = posição do quadril. af/an = braço de trás/da frente
   [braço, antebraço]; lf/ln = perna de trás/da frente [coxa, canela]; fo = giro do pé (ponta).
   ===================================================================== */
const Ilu = {
  L: {tr: 34, hd: 13.5, ua: 17, fa: 16, th: 21, sh: 21, ft: 7},
  pts(p) {
    const r = Math.PI / 180, L = this.L, v = (a, l) => [Math.sin(a * r) * l, Math.cos(a * r) * l], add = (a, b) => [a[0] + b[0], a[1] + b[1]];
    const H = p.h, u = [Math.sin(p.t * r), -Math.cos(p.t * r)], S = add(H, [u[0] * L.tr, u[1] * L.tr]), Hd = add(S, [u[0] * L.hd, u[1] * L.hd]);
    const arm = a => { const E = add(S, v(a[0], L.ua)); return [S, E, add(E, v(a[1], L.fa))]; };
    const leg = b => { const K = add(H, v(b[0], L.th)), A = add(K, v(b[1], L.sh)); return [H, K, A, add(A, v(b[1] + 90 + (p.fo || 0), L.ft))]; };
    return {H, S, Hd, u, af: arm(p.af), an: arm(p.an), lf: leg(p.lf), ln: leg(p.ln)};
  },
  mix(a, b, k) {
    if (typeof a === 'number') return a + ((b ?? a) - a) * k;
    if (Array.isArray(a)) return a.map((x, i) => this.mix(x, b && b[i], k));
    const o = {}; for (const key in a) o[key] = this.mix(a[key], b && b[key], k); return o;
  },
  svg(key, k) {
    const D = ILU[key], P = this.pts(this.mix(D.a, {...D.a, ...D.b}, k));
    const pl = (q, cls, w) => `<polyline class="${cls}" stroke-width="${w}" points="${q.map(x => x[0].toFixed(1) + ',' + x[1].toFixed(1)).join(' ')}"/>`;
    const c = (q, r, cls) => `<circle class="${cls}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${r}"/>`;
    const perna = (l, x) => `<g class="${x}">${pl(l.slice(0, 3), 'lg', 8.5)}${pl(l.slice(2), 'sh', 4.6)}</g>`;
    const braco = (a, x) => `<g class="${x}">${pl(a, 'sk', 5.4)}</g>`;
    const tipo = D.mao === 'plateS' ? 'plate' : D.mao;
    const mao = q => ({db: `<rect class="fpr" x="${(q[0] - 6.5).toFixed(1)}" y="${(q[1] - 2.6).toFixed(1)}" width="13" height="5.2" rx="2"/>`,
      plate: `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="9" fill="none" class="pr" stroke-width="3"/>${c(q, 2, 'fpr')}`,
      kb: c(q, 4.2, 'fpr'), rope: `<line class="pr" stroke-width="2.4" x1="${q[0]}" y1="${q[1]}" x2="${q[0] + 1}" y2="${q[1] + 7}"/>`}[tipo] || '');
    const back = [P.u[1], -P.u[0]], bun = D.front ? [P.Hd[0], P.Hd[1] - 7.5] : [P.Hd[0] + back[0] * 6.5 + P.u[0] * 2, P.Hd[1] + back[1] * 6.5 + P.u[1] * 2];
    const pescoco = [P.S, [P.S[0] + P.u[0] * 6, P.S[1] + P.u[1] * 6]];
    return `<line class="fl" stroke-width="2" x1="0" y1="104.5" x2="160" y2="104.5"/>${D.fundo ? D.fundo(P) : ''}
      ${braco(P.af, D.front ? '' : 'far')}${D.maoF !== false ? `<g class="${D.front ? '' : 'far'}">${mao(P.af[2])}</g>` : ''}${perna(P.lf, D.front ? '' : 'far')}
      ${pl(pescoco, 'sk', 4.5)}${pl([P.H, P.S], 'tp', 12.5)}${c(P.H, 6.4, 'flg')}${c(bun, 4.3, 'fhr')}${c(P.Hd, 7.3, 'fsk')}
      ${perna(P.ln, '')}${c(P.S, 4.4, 'ftp')}${braco(P.an, '')}${mao(D.mao === 'plateS' ? P.S : P.an[2])}${D.frente ? D.frente(P) : ''}`;
  }
};
const fx = {
  bench: (x, y, w) => `<rect class="fpr" opacity=".45" x="${x}" y="${y}" width="${w}" height="6" rx="2"/><line class="pr" stroke-width="2.5" x1="${x + 5}" y1="${y + 6}" x2="${x + 5}" y2="104"/><line class="pr" stroke-width="2.5" x1="${x + w - 5}" y1="${y + 6}" x2="${x + w - 5}" y2="104"/>`,
  seat: (x, y, w, bx, by, bh) => `<rect class="fpr" opacity=".45" x="${x}" y="${y}" width="${w}" height="6" rx="2"/>${bh ? `<rect class="fpr" opacity=".45" x="${bx}" y="${by}" width="6" height="${bh}" rx="2"/>` : ''}<line class="pr" stroke-width="2.5" x1="${x + w / 2}" y1="${y + 6}" x2="${x + w / 2}" y2="104"/>`,
  mat: () => `<rect class="fpr" opacity=".3" x="18" y="102.5" width="124" height="3" rx="1.5"/>`,

  pad: q => `<circle class="fpr" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.6"/>`
};

/* =====================================================================
   MÓDULO TREINOS
   docs: "treinos" {exercicios[{id,nome,grupo,series,reps,unid,descanso,obs,libId}], treinos, ativa}
         "treinos-hist-AAAA-MM" {sessoes}
   ===================================================================== */
(() => {
const GRUPOS = [{id: 'bracos', nome: 'Braços e superiores'}, {id: 'pernas', nome: 'Pernas'}, {id: 'gluteos', nome: 'Glúteos'}, {id: 'abdomen', nome: 'Abdômen'}, {id: 'cardio', nome: 'Cardio'}];
const G = Object.fromEntries(GRUPOS.map(g => [g.id, g]));
const UN = {reps: 'reps', min: 'min', seg: 'seg'};
const PASSO = {reps: 1, min: 1, seg: 5};
const ui = App.ui;
ui.tTab = ui.tTab || 'fichas'; ui.libView = ui.libView || 'sugestoes'; ui.calOff = ui.calOff || 0;

const T = {
  st: () => Store.get('treinos'),
  save: s => Store.put('treinos', s),
  ex: (s, id) => s.exercicios.find(e => e.id === id),
  hist: () => Store.ids('treinos-hist-').flatMap(k => Store.docs[k].sessoes || []).sort((a, b) => b.inicio - a.inicio),
  grupos: (s, t) => [...new Set(t.exercicios.map(id => (T.ex(s, id) || {}).grupo).filter(Boolean))],
  sig: t => (t.nome.match(/treino\s+(\S+)/i) || [])[1] || t.nome.split(/\s+/)[0] || '?',
  prog(a) {
    let feitas = 0, total = 0, exRest = 0;
    a.itens.forEach(it => { const f = it.series.filter(x => x.feito).length; feitas += f; total += it.series.length; if (f < it.series.length) exRest++; });
    return {feitas, total, exRest, pct: total ? Math.round(feitas * 100 / total) : 0};
  }
};
const grpDots = gs => gs.map(g => `<span class="tag"><span class="dot" style="--c:var(--g-${g})"></span>${G[g] ? G[g].nome : g}</span>`).join('');
const fmtRest = s => s >= 60 ? `${Math.floor(s / 60)}min${s % 60 ? ' ' + (s % 60) + 's' : ''}` : `${s}s`;
const exThumb = e => e && e.libId && LIB[e.libId] ? `${thumb(e.libId, 'tb')}` : `<span>${ic(e ? e.grupo : 'dumbbell')}</span>`;

/* Sua rotina: 4 dias (Seg glúteos, Qua superiores, Sex pernas, Sáb cardio), abdômen em todos */
const METAS_PADRAO = {musculacao: 3, abdomen: 3, cardio: 1};
const NOTA_ROTINA = 'Semana com só 3 dias: faça Glúteos, Superiores e Pernas, e inclua 15–20 min de cardio no fim de um deles (ou num 4º dia, se der). Priorize a execução correta, aumente as cargas aos poucos e respeite a recuperação — não precisa treinar abdômen todo dia.';
const ROTINA = [
  {nome: 'Glúteos + abdômen', dias: [1], ex: [['Barbell_Hip_Thrust', 4, 12, 90, 'Segurar 1s no alto'], ['Split_Squat_with_Dumbbells'], ['Romanian_Deadlift'], ['Thigh_Abductor'], ['One-Legged_Cable_Kickback'], ['Plank'], ['Reverse_Crunch']]},
  {nome: 'Superiores + abdômen', dias: [3], ex: [['Wide-Grip_Lat_Pulldown'], ['Seated_Cable_Rows'], ['Dumbbell_Shoulder_Press'], ['Side_Lateral_Raise'], ['Dumbbell_Bicep_Curl'], ['Triceps_Pushdown_-_Rope_Attachment'], ['Crunches'], ['Russian_Twist']]},
  {nome: 'Pernas + abdômen', dias: [5], ex: [['Barbell_Squat'], ['Leg_Press'], ['Leg_Extensions'], ['Lying_Leg_Curls'], ['Stiff-Legged_Dumbbell_Deadlift'], ['Standing_Calf_Raises'], ['Side_Bridge'], ['Flat_Bench_Lying_Leg_Raise']]},
  {nome: 'Cardio + abdômen', dias: [6], ex: [['Walking_Treadmill', 1, 30, 0, 'Caminhada inclinada ou troque pelo elíptico/bicicleta'], ['Mountain_Climbers'], ['Cross-Body_Crunch'], ['Plank']]}
];
/* aplica a rotina sem apagar histórico: reaproveita exercícios pelo libId e atualiza fichas de mesmo nome */
function aplicarRotina(s) {
  if (s.exemplo) { s.treinos = []; s.exercicios = []; s.exemplo = false; }
  ROTINA.forEach(f => {
    const ids = f.ex.map(([k, se, r, d, obs]) => {
      const l = LIB[k];
      let e = s.exercicios.find(x => x.libId === k);
      if (!e) { e = {id: uid(), nome: l.n, grupo: l.g, series: se ?? l.s, reps: r ?? l.r, unid: l.u, descanso: d ?? l.d, obs: obs || '', libId: k}; s.exercicios.push(e); }
      return e.id;
    });
    const t = s.treinos.find(x => x.nome === f.nome);
    if (t) { t.dias = [...f.dias]; t.exercicios = ids; } else s.treinos.push({id: uid(), nome: f.nome, dias: [...f.dias], exercicios: ids});
  });
  s.metas = s.metas || {...METAS_PADRAO};
  s.nota = s.nota || NOTA_ROTINA;
  return s;
}
const modelo = () => aplicarRotina({v: 1, exercicios: [], treinos: [], ativa: null});
App.hooks.semear.push(() => { if (!Store.get('treinos')) Store.put('treinos', modelo()); });
const metasDe = s => ({...METAS_PADRAO, ...(s.metas || {})});
/* contagem da semana por tipo: só séries realmente feitas em treinos salvos */
function semanaTipos(H, ini, fim) {
  const c = {musculacao: 0, abdomen: 0, cardio: 0};
  H.filter(x => x.inicio >= ini && x.inicio < fim).forEach(x => {
    const fez = g => x.itens.some(i => (Array.isArray(g) ? g.includes(i.grupo) : i.grupo === g) && i.feitas.some(v => v != null));
    if (fez(['bracos', 'pernas', 'gluteos'])) c.musculacao++;
    if (fez('abdomen')) c.abdomen++;
    if (fez('cardio')) c.cardio++;
  });
  return c;
}
function emptyState() {
  return `<div class="card empty">${ic('dumbbell')}<h2>Monte seus treinos</h2>
    <p class="muted sm">Carregue sua rotina de 4 dias (Seg glúteos, Qua superiores, Sex pernas, Sáb cardio, com abdômen em todos) e ajuste do seu jeito, ou crie do zero com a biblioteca.</p>
    <div class="row-btns" style="width:100%"><button class="btn ghost" data-act="tZero">Do zero</button><button class="btn primary" data-act="tModelo">Usar minha rotina</button></div></div>`;
}

    return `<section class="card soft"><div class="hero"><div class="grow"><p class="eyebrow">${ic('dumbbell')} Seu treino de hoje</p><h2>${esc(t.nome)}</h2>

      ${done ? `<p class="sm row" style="color:var(--ok);gap:8px">${ic('check')} Feito · ${fmtDur(done.fim - done.inicio)}<button class="btn link sm" style="color:var(--danger)" data-act="hExcluir" data-id="${done.id}">${ic('trash')} Apagar</button></p>` : `<button class="btn primary sm" style="margin-top:6px" data-act="tIniciar" data-id="${t.id}">Começar treino ${ic('next')}</button>`}</div>

function progresso() {

  const meta = metasDe(s).musculacao || 3, ini = semana()[0].getTime();
  const feitos = semanaTipos(T.hist(), ini, ini + 7 * 864e5).musculacao;

}

/* ----- sessão: um exercício por vez ----- */
function viewSessao() {
  const s = T.st(), a = s && s.ativa;
  if (!a) return viewTreinos();
  if (!(a.aberto >= 0 && a.aberto < a.itens.length)) a.aberto = 0;
  const i = a.aberto, it = a.itens[i], p = T.prog(a), n = a.itens.length;
  const done = it.series.filter(x => x.feito).length;
  const prox = it.series.findIndex(x => !x.feito);
  return `<header class="top sub"><button class="icon-btn" data-act="go" data-r="treinos" aria-label="Sair da tela do treino">${ic('back')}</button>
    <div style="text-align:center"><p class="eyebrow" style="margin:0">${esc(a.nome)}</p><span class="sm muted"><span id="elapsed">${fmtDur(Date.now() - a.inicio)}</span> · ${p.feitas}/${p.total} séries</span></div>
    <button class="icon-btn" data-act="sLista" aria-label="Ver todos os exercícios">${ic('book')}</button></header>
    <div class="sess-top"><div class="between"><span class="sm muted">Exercício ${i + 1} de ${n}</span><span class="sm muted">${p.exRest ? `faltam ${plural(p.exRest, 'exercício')}` : 'tudo feito'}</span></div>
    <div class="segbar">${a.itens.map((x, j) => `<button class="${j === i ? 'cur' : x.series.every(y => y.feito) ? 'done' : ''}" data-act="sIr" data-i="${j}" aria-label="Ir para ${esc(x.nome)}"></button>`).join('')}</div></div>
    <div class="stack">${demo(it.libId, it.grupo)}
    <div><h1 style="font-size:2.1rem">${esc(it.nome)}</h1>
      <p class="sm muted" style="margin-top:4px">${prox >= 0 ? `Série ${prox + 1} de ${it.series.length}` : 'Séries concluídas'} · ${it.reps} ${UN[it.unid]}${it.descanso ? ` · descanso ${fmtRest(it.descanso)}` : ''}</p>
      ${it.obs ? `<p class="obs">${esc(it.obs)}</p>` : ''}
      <div class="row" style="gap:16px">${it.libId && LIB[it.libId] ? `<button class="btn link sm" data-act="sComo" data-k="${it.libId}">Como fazer?</button>` : ''}
      <button class="btn link sm" data-act="sRest" data-i="${i}">${ic('clock')} Alterar descanso</button></div></div>
    <div class="sets">${it.series.map((se, j) => setRow(it, i, se, j)).join('')}</div>
    <div id="timerInline"></div>
    ${!Timer.on && it.descanso ? `<button class="btn ghost" data-act="sDescanso" data-i="${i}">${ic('clock')} Iniciar descanso (${fmtRest(it.descanso)})</button>` : ''}
    </div>
    <div class="sess-nav"><button class="btn sand" data-act="sIr" data-i="${i - 1}" ${i ? '' : 'disabled'} aria-label="Exercício anterior">${ic('back')}</button>
    ${i < n - 1 ? `<button class="btn ${done === it.series.length ? 'primary' : 'sand'}" data-act="sIr" data-i="${i + 1}">Próximo exercício ${ic('next')}</button>`
      : `<button class="btn primary" data-act="sFinalizar">${ic('check')} Finalizar treino</button>`}</div>
    <div class="row" style="justify-content:space-between;margin-top:6px">${i < n - 1 ? `<button class="btn link sm" data-act="sFinalizar">Finalizar agora</button>` : '<span></span>'}
      <button class="btn link sm" style="color:var(--danger)" data-act="sDescartar">${ic('x')} Cancelar treino</button></div>`;
}
function setRow(it, i, se, j) {
  const v = se.reps ?? it.reps, d = se.feito ? v - it.reps : 0;
  return `<div class="set ${se.feito ? 'feito' : ''}"><div class="n">Série ${j + 1}${d < 0 ? `<span class="delta menos" title="Abaixo do planejado">${d}</span>` : d > 0 ? `<span class="delta mais">+${d}</span>` : ''}</div>
    <div class="stepper"><button data-act="sMenos" data-i="${i}" data-j="${j}" aria-label="Diminuir">−</button>
    <input class="reps-in" id="r-${i}-${j}" type="number" inputmode="numeric" min="0" value="${v}" data-chg="sReps" data-i="${i}" data-j="${j}" aria-label="${UN[it.unid]} feitas na série ${j + 1}">
    <button data-act="sMais" data-i="${i}" data-j="${j}" aria-label="Aumentar">+</button><span class="un">${UN[it.unid]}</span></div>
    <button class="check" role="checkbox" aria-checked="${se.feito}" aria-label="Série ${j + 1} concluída" data-act="sSerie" data-i="${i}" data-j="${j}">${ic('check')}</button></div>`;
}
function resumoSessao(x) {
  let plan = 0, exec = 0, feitas = 0, total = 0;
  x.itens.forEach(it => { plan += it.plan * it.reps; total += it.plan; it.feitas.forEach(v => { if (v != null) { exec += v; feitas++; } }); });
  return {plan, exec, feitas, total, pct: plan ? Math.round(exec * 100 / plan) : 0};
}
function paraSalvar(a) {
  return {id: a.id, treinoId: a.treinoId, nome: a.nome, inicio: a.inicio, fim: Date.now(),
    itens: a.itens.map(it => ({exId: it.exId, nome: it.nome, grupo: it.grupo, reps: it.reps, unid: it.unid, plan: it.series.length,
      feitas: it.series.map(s => s.feito ? (s.reps ?? it.reps) : null)}))};
}
setInterval(() => { const el = $('#elapsed'), s = T.st(); if (el && s && s.ativa) el.textContent = fmtDur(Date.now() - s.ativa.inicio); }, 20000);
document.addEventListener('visibilitychange', () => { const s = T.st(); if (document.visibilityState === 'visible' && s && s.ativa && App.route() === 'sessao') Wake.on(); });

/* ----- calendário (só treinos salvos contam) ----- */
function viewCalendario() {
  const H = T.hist(), porDia = {};
  H.forEach(x => { const k = dkey(new Date(x.inicio)); (porDia[k] = porDia[k] || []).push(x); });
  const ref = new Date(); ref.setDate(ref.getDate() + 7 * ui.calOff);
  const dias = semana(ref), hoje = dkey();
  const total = dias.reduce((a, d) => a + (porDia[dkey(d)] || []).length, 0);
  const diasTreino = dias.filter(d => (porDia[dkey(d)] || []).length).length;
  const titulo = ui.calOff === 0 ? 'Esta semana' : ui.calOff === -1 ? 'Semana passada' : `${fmtData(dias[0])} – ${fmtData(dias[6])}`;
  const sem = []; for (let i = 11; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - 7 * i); sem.push(semana(d)); }
  const selK = dkey(dias[0]);
  const grid = ORDEM_SEMANA.map((dw, row) => `<span>${DIA_CURTO[dw].slice(0, 1)}</span>${sem.map((w, ci) => { const d = w[row], k = dkey(d), n = (porDia[k] || []).length;
    return `<button class="${n > 1 ? 'on2' : n ? 'on' : ''} ${dkey(w[0]) === selK ? 'sel' : ''} ${k > hoje ? 'fut' : ''}" data-act="calIr" data-o="${ci - 11}" aria-label="${fmtData(d)}: ${n ? plural(n, 'treino') : 'sem treino'}"></button>`; }).join('')}`).join('');
  return `<section class="card"><div class="cal-nav"><button class="icon-btn sm" data-act="calNav" data-d="-1" aria-label="Semana anterior">${ic('back')}</button>
      <div style="text-align:center"><h3>${titulo}</h3><p class="sm muted">${fmtData(dias[0])} – ${fmtData(dias[6])}</p></div>
      <button class="icon-btn sm" data-act="calNav" data-d="1" aria-label="Próxima semana" ${ui.calOff >= 0 ? 'disabled' : ''}>${ic('next')}</button></div>
    <div class="row" style="justify-content:center;gap:22px;margin:14px 0 4px">${ring(Math.min(100, total * 100 / (metasDe(T.st()).musculacao || 3)), 70, 4, String(total))}
      <div><p class="sm"><b>${plural(total, 'treino')}</b> ${ui.calOff === 0 ? 'nesta semana' : 'na semana'}</p><p class="sm muted">${plural(diasTreino, 'dia ativo', 'dias ativos')}</p></div></div>
    <div class="cal-days">${dias.map(d => { const k = dkey(d), xs = porDia[k] || [];
      return `<div class="cal-day ${k === hoje ? 'today' : ''}"><div class="d"><span>${DIA_CURTO[d.getDay()]}</span><b>${d.getDate()}</b></div><div class="s">
        ${xs.length ? xs.map(x => `<button class="done" style="all:unset;display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer" data-act="hExcluir" data-id="${x.id}" aria-label="Apagar ${esc(x.nome)} deste dia"><i style="width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none">${ic('check')}</i><span class="grow">${esc(x.nome)} <span class="muted sm">· ${fmtDur(x.fim - x.inicio)}</span></span><span class="muted">${ic('x')}</span></button>`).join('') : `<span class="none">${k > hoje ? '' : '—'}</span>`}</div></div>`; }).join('')}</div>
      <p class="sm muted" style="margin-top:8px">Lançou um treino por engano? Toque nele para apagar.</p></section>
    <section class="card"><div class="between" style="margin-bottom:10px"><h3>Últimas 12 semanas</h3><span class="tag"><span class="dot" style="--c:var(--sage-2)"></span>treinou</span></div>
      <div class="habit">${grid}</div><p class="sm muted" style="margin-top:10px">Toque em uma coluna para ver aquela semana. Só entram treinos finalizados e salvos.</p></section>`;
}

/* ----- histórico e evolução ----- */
function barChart(vals, labels, meta) {
  const W = 320, H = 132, pt = 16, pb = 20, max = Math.max(meta || 0, ...vals, 1), bw = W / vals.length, ih = H - pt - pb;
  const y = v => pt + ih - (v / max) * ih;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Treinos por semana nas últimas ${vals.length} semanas">
    <line class="grid" x1="0" x2="${W}" y1="${H - pb}" y2="${H - pb}"/>
    ${meta ? `<line class="meta" x1="0" x2="${W}" y1="${y(meta)}" y2="${y(meta)}"/><text x="${W}" y="${y(meta) - 4}" text-anchor="end">meta ${meta}</text>` : ''}
    ${vals.map((v, i) => { const x = i * bw + bw * .26, w = bw * .48, h = Math.max(v ? 3 : 0, (v / max) * ih);
      return `<rect class="bar-r ${i === vals.length - 1 ? 'cur' : ''}" x="${x.toFixed(1)}" y="${(H - pb - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="4"/>
        ${v ? `<text class="val" x="${(x + w / 2).toFixed(1)}" y="${(H - pb - h - 4).toFixed(1)}" text-anchor="middle">${v}</text>` : ''}
        <text x="${(x + w / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${labels[i]}</text>`; }).join('')}</svg>`;
}
function lineChart(pts, un) {
  const W = 320, H = 150, pl = 10, pr = 10, pt = 20, pb = 22;
  const max = Math.max(1, ...pts.map(p => Math.max(p.exec, p.plan)));
  const x = i => pts.length === 1 ? W / 2 : pl + i * (W - pl - pr) / (pts.length - 1);
  const y = v => pt + (1 - v / max) * (H - pt - pb);
  const line = k => pts.map((p, i) => `${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join(' ');
  const last = pts.length - 1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Total de ${un} por treino, planejado e executado">
    <line class="grid" x1="0" x2="${W}" y1="${H - pb}" y2="${H - pb}"/>
    <polygon class="area" points="${x(0).toFixed(1)},${H - pb} ${line('exec')} ${x(last).toFixed(1)},${H - pb}"/><polyline class="plan" points="${line('plan')}"/><polyline class="exec" points="${line('exec')}"/>
    ${pts.map((p, i) => `<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(p.exec).toFixed(1)}" r="3.5"/>`).join('')}
    <text class="val" x="${x(last).toFixed(1)}" y="${(y(pts[last].exec) - 8).toFixed(1)}" text-anchor="${pts.length === 1 ? 'middle' : 'end'}">${pts[last].exec}</text>
    <text x="${x(0).toFixed(1)}" y="${H - 5}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}">${fmtData(new Date(pts[0].t))}</text>
    ${pts.length > 1 ? `<text x="${x(last).toFixed(1)}" y="${H - 5}" text-anchor="end">${fmtData(new Date(pts[last].t))}</text>` : ''}</svg>`;
}
function viewHistorico(s) {
  const H = T.hist();
  if (!H.length) return `<div class="card empty">${ic('chart')}<h2>Seu histórico aparece aqui</h2><p class="muted sm">Depois do primeiro treino finalizado você vê frequência, histórico por grupo muscular e planejado × executado.</p></div>`;
  const wk = d => dkey(semana(d)[0]);
  const semanas = []; for (let i = 7; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - 7 * i); semanas.push(semana(d)[0]); }
  const cont = {}; H.forEach(x => { const k = wk(new Date(x.inicio)); cont[k] = (cont[k] || 0) + 1; });
  const meta = new Set(s.treinos.flatMap(t => t.dias)).size;
  const vals = semanas.map(w => cont[dkey(w)] || 0);
  let seq = 0; const d = new Date(semanas[7]); if (!cont[dkey(d)]) d.setDate(d.getDate() - 7);
  while (cont[dkey(d)]) { seq++; d.setDate(d.getDate() - 7); }
  const media = (vals.reduce((a, v) => a + v, 0) / 8).toFixed(1).replace('.', ',');
  const lim = Date.now() - 30 * 864e5; let pp = 0, pe = 0;
  H.filter(x => x.inicio >= lim).forEach(x => { const r = resumoSessao(x); pp += r.plan; pe += r.exec; });
  const exec30 = pp ? Math.round(pe * 100 / pp) : 0;
  const grupos = GRUPOS.map(g => { let ses = 0, series = 0, ult = 0;
    H.forEach(x => { const f = x.itens.filter(i => i.grupo === g.id).reduce((a, i) => a + i.feitas.filter(v => v != null).length, 0); if (f) { ses++; series += f; ult = Math.max(ult, x.inicio); } });
    return {...g, ses, series, ult}; });
  const exs = {}; H.forEach(x => x.itens.forEach(it => { if (!exs[it.exId]) exs[it.exId] = {nome: it.nome, n: 0, unid: it.unid}; exs[it.exId].n++; }));
  const exIds = Object.keys(exs).sort((a, b) => exs[b].n - exs[a].n);
  if (!exs[ui.eEx]) ui.eEx = exIds[0];
  const sel = exs[ui.eEx];
  const ocorr = H.filter(x => x.itens.some(i => i.exId === ui.eEx)).slice(0, 12).reverse()
    .map(x => { const it = x.itens.find(i => i.exId === ui.eEx); return {t: x.inicio, plan: it.plan * it.reps, exec: it.feitas.reduce((a, v) => a + (v || 0), 0), it}; });
  const filtro = ui.hGrupo || 'todos';
  const Hf = filtro === 'todos' ? H : H.filter(x => x.itens.some(i => i.grupo === filtro));
  const lista = Hf.slice(0, ui.hTodos ? Hf.length : 8).map(x => { const r = resumoSessao(x), open = ui.hOpen === x.id;
    return `<div style="display:flex;gap:6px;align-items:flex-start"><button class="hrow" style="flex:1;min-width:0" data-act="hAbrir" data-id="${x.id}" aria-expanded="${open}"><div class="between"><div class="grow"><h3>${esc(x.nome)}</h3>
      <p class="sm muted">${DIA_CURTO[new Date(x.inicio).getDay()]}, ${fmtData(new Date(x.inicio))} · ${fmtDur(x.fim - x.inicio)} · ${r.feitas}/${r.total} séries</p></div>
      <span class="pct" style="color:${r.pct >= 100 ? 'var(--ok)' : r.pct >= 80 ? 'var(--ink)' : 'var(--warn)'}">${r.pct}%</span></div>
      ${open ? `<div class="hdet">${x.itens.map(it => `<div><span>${esc(it.nome)}</span><span>${it.feitas.map(v => v == null ? '–' : v).join(' · ')} <small>de ${it.plan}×${it.reps}</small></span></div>`).join('')}</div>` : ''}</button>
      <button class="icon-btn" style="color:var(--danger);margin-top:6px" data-act="hExcluir" data-id="${x.id}" aria-label="Apagar ${esc(x.nome)}">${ic('trash')}</button></div>`; }).join('');
  return `<div class="tiles">
      <div class="tile"><b>${H.length}</b><span>treinos realizados</span></div>
      <div class="tile"><b>${vals[7]}${meta ? `<small style="font-size:1rem;color:var(--muted)">/${meta}</small>` : ''}</b><span>nesta semana</span></div>
      <div class="tile"><b>${seq}</b><span>${seq === 1 ? 'semana seguida' : 'semanas seguidas'}</span></div>
      <div class="tile"><b>${exec30}%</b><span>do planejado (30 dias)</span></div></div>
    <section class="card"><div class="between"><h3>Frequência semanal</h3><span class="tag">média ${media}/semana</span></div>
      ${barChart(vals, semanas.map(w => `${w.getDate()}/${w.getMonth() + 1}`), meta)}</section>
    <section class="card"><h3>Por grupo muscular</h3><div style="margin-top:6px">${grupos.map(g => `<div class="grow-row"><span class="dot" style="--c:var(--g-${g.id})"></span>
      <div><span class="sm">${g.nome}</span><p class="sm muted">${g.ses ? `${plural(g.ses, 'treino')} · ${plural(g.series, 'série')}` : 'Ainda não treinado'}</p></div>
      <span class="sm muted">${g.ult ? fmtData(new Date(g.ult)) : ''}</span></div>`).join('')}</div></section>
    <section class="card"><h3>Evolução por exercício</h3>
      <select class="t" id="ev-ex" style="margin-top:10px" data-chg="eEx" aria-label="Escolher exercício">${exIds.map(id => `<option value="${id}" ${id === ui.eEx ? 'selected' : ''}>${esc(exs[id].nome)}</option>`).join('')}</select>
      ${lineChart(ocorr, UN[sel.unid])}
      <div class="legend-l"><span><i></i>executado (total de ${UN[sel.unid]})</span><span><i class="p"></i>planejado</span></div></section>
    <div class="section-t"><h2>Treinos concluídos</h2><span class="tag">${plural(Hf.length, 'treino')}</span></div>
    <div class="chips" role="group" aria-label="Filtrar por grupo">${[{id: 'todos', nome: 'Tudo'}, ...GRUPOS].map(g => `<button class="chip" aria-pressed="${filtro === g.id}" data-act="hGrupo" data-g="${g.id}">${g.nome}</button>`).join('')}</div>
    <div class="hist">${lista || '<p class="muted sm">Nenhum treino com esse grupo.</p>'}</div>
    ${Hf.length > 8 ? `<button class="btn ghost block" data-act="hTodos">${ui.hTodos ? 'Mostrar menos' : 'Ver histórico completo'}</button>` : ''}`;
}

/* ----- ações ----- */
function iniciar(t, s) {
  const itens = t.exercicios.map(id => T.ex(s, id)).filter(Boolean).map(e => ({exId: e.id, nome: e.nome, grupo: e.grupo, reps: e.reps, unid: e.unid || 'reps',
    descanso: e.descanso || 0, obs: e.obs || '', libId: e.libId || '', series: Array.from({length: e.series}, () => ({feito: false, reps: null}))}));
  s.ativa = {id: uid(), treinoId: t.id, nome: t.nome, inicio: Date.now(), aberto: 0, itens};
  T.save(s); Wake.on(); App.go('sessao');
}

    sSerie: d => {

          if (alt >= 0) { a.aberto = alt; label = `Próximo: ${a.itens[alt].nome}`; window.scrollTo(0, 0); }
        } else label = `${it.nome} · série ${it.series.findIndex(x => !x.feito) + 1}`;

    sDescartar: () => Sheet.confirm({title: 'Cancelar este treino?', text: 'Ele não será salvo: nada vai para o histórico nem para o calendário.', ok: 'Cancelar treino', danger: true,

        <div class="hdet">${x.itens.map(it => `<div><span>${esc(it.nome)}</span><span>${it.feitas.map(v => v == null ? '–' : v).join(' · ')} <small>de ${it.plan}×${it.reps}</small></span></div>`).join('')}</div>

      for (const k of Store.ids('treinos-hist-')) { const h = Store.get(k), n = h.sessoes.length; h.sessoes = h.sessoes.filter(x => x.id !== d.id); if (h.sessoes.length !== n) { Store.put(k, h); break; } }
