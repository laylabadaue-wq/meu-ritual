/* =====================================================================
   MÓDULO PELE (skincare)
   doc "skincare": {rotinas: {0..6: {manha:[{id,prodId,obs}], noite}}, checks: {AAAA-MM-DD: {manha, noite}}}
   Produtos vêm do catálogo único (Minha coleção).
   ===================================================================== */
(() => {
const PER = {manha: ['Manhã', 'sun'], noite: ['Noite', 'moon']};
const ui = App.ui;
ui.kDia = ui.kDia ?? new Date().getDay();
ui.kPer = ui.kPer || (new Date().getHours() < 15 ? 'manha' : 'noite');

const K = {
  st: () => Store.get('skincare'),
  save: s => Store.put('skincare', s),
  rot: (s, dia, per) => ((s.rotinas[dia] || {})[per] || []).filter(x => Produtos.get(x.prodId)),
  ensure(s, dia, per) { s.rotinas[dia] = s.rotinas[dia] || {manha: [], noite: []}; s.rotinas[dia][per] = s.rotinas[dia][per] || []; return s.rotinas[dia][per]; },
  checks: (s, k, per) => ((s.checks || {})[k] || {})[per] || [],
  prog(s, dia, k, per) { const r = K.rot(s, dia, per), c = K.checks(s, k, per), f = r.filter(x => c.includes(x.id)).length; return {f, t: r.length, pct: r.length ? Math.round(f * 100 / r.length) : 0}; },
  dataDoDia: dia => semana().find(d => d.getDay() === dia)
};
const catNome = p => (CATS[p.cat] || CATS.outro)[0];

/* migração: produtos que ficavam dentro do skincare passam para a coleção (mesmos ids) */
App.hooks.migrar.push(() => {
  const s = K.st();
  if (!s || !Array.isArray(s.produtos) || !s.produtos.length) return;
  const d = Produtos.doc();
  s.produtos.forEach(p => { if (!d.produtos.some(x => x.id === p.id)) d.produtos.push({id: p.id, nome: p.nome, marca: '', cat: CATS[p.cat] ? p.cat : 'outro', finalidade: '', obs: p.obs || '', foto: null}); });
  Store.put('colecao', d); delete s.produtos; K.save(s);
});
App.hooks.usos.push(id => { const s = K.st(); if (!s) return [];
  const n = Object.values(s.rotinas).reduce((a, d) => a + ['manha', 'noite'].filter(p => (d[p] || []).some(x => x.prodId === id)).length, 0);
  return n ? [`${plural(n, 'rotina')} de pele`] : []; });
App.hooks.removerProduto.push(id => { const s = K.st(); if (!s) return;
  Object.values(s.rotinas).forEach(d => ['manha', 'noite'].forEach(p => { if (d[p]) d[p] = d[p].filter(x => x.prodId !== id); })); K.save(s); });

/* Sua rotina: manhã igual todos os dias; noite = limpeza + tratamento do dia + creme facial (+ olhos nas noites de hidratação) + sobrancelhas */
const NOTA_PELE = 'Retinol: sobre a pele completamente seca. PowerPad: passe suavemente, sem esfregar. Argila rosa: respeite o tempo da embalagem. Não combine PowerPad, argila e retinol na mesma noite. Se houver irritação, suspenda os ativos até a pele se recuperar. Creme dos olhos nas demais noites só se o fabricante permitir.';
const EXEMPLO_NOMES = ['Gel de limpeza', 'Tônico calmante', 'Sérum de vitamina C', 'Hidratante facial', 'Protetor solar FPS 50', 'Retinol', 'Esfoliante suave', 'Creme para área dos olhos', 'Máscara hidratante'];
function aplicarRotinaPele(s) {
  const d = Produtos.doc(), k = t => (t || '').trim().toLowerCase();
  const prod = (nome, cat, finalidade, obs = '', marca = '') => {
    let p = d.produtos.find(x => k(x.nome) === k(nome) && k(x.marca) === k(marca));
    if (!p) { p = {id: uid(), nome, marca, cat, finalidade, obs, foto: null}; d.produtos.push(p); }
    return p;
  };
  const P = {
    sab: prod('Sabonete facial', 'limpeza', 'Limpeza suave', 'Lave o rosto suavemente'),
    olh: prod('Creme para área dos olhos', 'olhos', 'Hidratar a área dos olhos', 'Pequena quantidade'),
    cre: prod('Creme facial', 'hidratante', 'Hidratação', 'Camada fina, principalmente na zona T'),
    fps: prod('Protetor solar FPS 50', 'protetor', 'Proteção solar', 'Finalize a rotina e reaplique ao longo do dia'),
    ret: prod('Retinol', 'tratamento', 'Textura, poros e manchas', 'Sobre a pele completamente seca'),
    hid: prod('Hidratação noturna', 'mascara', 'Hidratação intensa'),
    pad: prod('PowerPad', 'esfoliante', 'Textura e poros', 'Passe suavemente, sem esfregar', 'Medicube'),
    arg: prod('Argila rosa', 'mascara', 'Limpeza dos poros', 'Respeite o tempo indicado na embalagem'),
    sob: prod('Sérum para sobrancelhas', 'outro', 'Sobrancelhas', 'Conforme as instruções da embalagem')
  };
  if (s.exemplo) { // tira da coleção os produtos do exemplo que você não editou nem usa
    const usados = new Set(Object.values(P).map(p => p.id));
    d.produtos = d.produtos.filter(p => usados.has(p.id) || !EXEMPLO_NOMES.includes(p.nome) || p.foto || p.marca || Produtos.usos(p.id).some(u => !u.includes('pele')));
  }
  Store.put('colecao', d);
  const st = (p, obs = '') => ({id: uid(), prodId: p.id, obs});
  const noite = {1: P.ret, 2: P.hid, 3: P.ret, 4: P.pad, 5: P.ret, 6: P.hid, 0: P.arg};
  s.rotinas = {};
  for (let i = 0; i < 7; i++) {
    const t = noite[i], n = [st(P.sab), st(t)];
    if (t === P.hid) n.push(st(P.olh));
    n.push(st(P.cre), st(P.sob));
    s.rotinas[i] = {manha: [st(P.sab), st(P.olh), st(P.cre), st(P.fps)], noite: n};
  }
  s.exemplo = false; s.minhaRotina = true; s.nota = s.nota || NOTA_PELE; s.checks = s.checks || {};
  return s;
}
App.hooks.semear.push(() => { if (!Store.get('skincare')) Store.put('skincare', aplicarRotinaPele({v: 1, rotinas: {}, checks: {}})); });
function emptyState() {
  return `<div class="card empty">${ic('drop')}<h2>Sua rotina de pele</h2>
    <p class="muted sm">Carregue sua rotina: manhã com sabonete, olhos, creme facial e FPS 50; à noite retinol (seg, qua, sex), hidratação (ter, sáb), PowerPad (qui) e argila rosa (dom).</p>
    <div class="row-btns" style="width:100%"><button class="btn ghost" data-act="kZero">Do zero</button><button class="btn primary" data-act="kModelo">Usar minha rotina</button></div></div>`;
}
function stepBtn(s, x, k, per, done, futuro, idx) {
  const p = Produtos.get(x.prodId), obs = x.obs || p.obs || p.finalidade;
  return `<button class="step" role="checkbox" aria-checked="${done}" data-act="kCheck" data-id="${x.id}" data-k="${k}" data-per="${per}" ${futuro ? 'disabled' : ''}>
    <span class="box">${ic('check')}</span>${pimg(p, 46)}<span class="grow"><p class="nome">${esc(p.nome)}</p><p class="tag">${esc(catNome(p))}${obs ? ` · ${esc(obs)}` : ''}</p></span>
    ${idx != null ? `<span class="ord">${idx + 1}</span>` : '<span></span>'}</button>`;
}

/* ----- tela inicial ----- */
function home() {
  const s = K.st();
  if (!s) return Store.ready ? emptyState() : loadingCard();
  const dia = new Date().getDay(), k = dkey(), per = new Date().getHours() < 15 ? 'manha' : 'noite';
  const passos = K.rot(s, dia, per), c = K.checks(s, k, per), g = K.prog(s, dia, k, per);
  const outro = per === 'manha' ? 'noite' : 'manha', go = K.prog(s, dia, k, outro);
  return `<section class="card"><div class="between"><div><p class="eyebrow">${ic('drop')} Skincare de hoje</p><h2>Rotina da ${PER[per][0].toLowerCase()}</h2></div>${ring(g.pct, 62, 4, g.pct + '%')}</div>
    ${passos.length ? `<div class="steps" style="margin-top:6px">${passos.map(x => stepBtn(s, x, k, per, c.includes(x.id), false)).join('')}</div>` : `<p class="sm muted" style="margin-top:6px">Nenhuma etapa para agora.</p>`}
    <button class="per-row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px" data-act="go" data-r="pele" data-per="${outro}" data-dia="${dia}">${ic(PER[outro][1])}<span><span class="sm">${PER[outro][0]}</span><div class="bar" style="margin-top:5px"><i style="width:${go.pct}%"></i></div></span>
      <span class="sm muted">${go.t ? `${go.f}/${go.t}` : '—'}</span></button></section>`;
}
function progresso() {
  const s = K.st(); if (!s) return null;
  const hoje = dkey(), dias = semana().filter(d => dkey(d) <= hoje);
  let ok = 0;
  dias.forEach(d => { const k = dkey(d), a = K.prog(s, d.getDay(), k, 'manha'), b = K.prog(s, d.getDay(), k, 'noite'); if (a.t + b.t && a.f + b.f === a.t + b.t) ok++; });
  return {label: 'Skincare', valor: `${ok}/${dias.length}`, pct: Math.round(ok * 100 / dias.length)};
}

/* ----- tela Pele: dia + período + lista, tudo numa tela ----- */
function viewPele() {
  const s = K.st();
  if (!s) return Store.ready ? emptyState() : loadingCard();
  const hojeK = dkey(), data = K.dataDoDia(ui.kDia), k = dkey(data), futuro = k > hojeK, per = ui.kPer;
  const passos = K.rot(s, ui.kDia, per), c = K.checks(s, k, per), g = K.prog(s, ui.kDia, k, per);

      <div class="row-btns" style="margin-top:10px"><button class="btn sm ghost" data-act="kExOk">Manter</button><button class="btn sm primary" data-act="kRotina">Usar minha rotina</button></div></div>`

  const quando = k === hojeK ? 'Hoje' : `${DIA_LONGO[ui.kDia]}, ${fmtData(data)}`;
  const lista = ui.kEdit
    ? passos.map((x, i) => { const p = Produtos.get(x.prodId);
        return `<div class="step edit" data-sort><button class="handle" aria-label="Arrastar para mudar a ordem">${ic('grip')}</button>${pimg(p, 42)}<span class="grow"><p class="nome">${esc(p.nome)}</p><p class="tag">${esc(catNome(p))}${x.obs ? ` · ${esc(x.obs)}` : ''}</p></span>
          <span class="ctl"><button class="icon-btn sm" data-act="kStepEdit" data-id="${x.id}" aria-label="Observação da etapa">${ic('pencil')}</button>
          <button class="icon-btn sm" data-act="kDel" data-id="${x.id}" aria-label="Remover etapa">${ic('x')}</button></span></div>`; }).join('')
    : passos.map((x, i) => stepBtn(s, x, k, per, c.includes(x.id), futuro, i)).join('');
  return `<div class="stack">${banner}${days}${pers}
    <section class="card"><div class="between" style="margin-bottom:4px">${ring(g.pct, 64, 4, g.pct + '%')}<div class="grow"><h3>${quando}</h3><p class="sm muted">${g.t ? `${g.f} de ${plural(g.t, 'cuidado')}` : 'Sem etapas'}${futuro ? ' · ainda não chegou' : ''}</p></div>
      <button class="btn sm ${ui.kEdit ? 'primary' : 'ghost'}" data-act="kEdit">${ui.kEdit ? 'Pronto' : `${ic('pencil')} Editar`}</button></div>
      <div class="steps" ${ui.kEdit ? 'data-sort-act="kMove" style="background:var(--surface)"' : ''}>${lista || `<p class="sm muted" style="padding:14px 0">Nenhuma etapa na rotina da ${PER[per][0].toLowerCase()} de ${DIA_LONGO[ui.kDia]}.</p>`}</div>
      ${ui.kEdit || !passos.length ? `<div class="row-btns" style="margin-top:12px"><button class="btn sand" data-act="kAdd">${ic('plus')} Adicionar produto</button>
        ${passos.length ? `<button class="btn ghost" data-act="kCopiar">${ic('copy')} Copiar para…</button>` : ''}</div>`
        : !futuro && g.f < g.t ? `<button class="btn primary block" style="margin-top:12px" data-act="kTudo" data-k="${k}">Marcar tudo como feito</button>` : ''}</section>
    ${s.nota ? `<section class="card soft"><div class="between"><h3>Cuidados importantes</h3><button class="btn link sm" data-act="kNota">Editar</button></div><p class="sm" style="margin-top:6px">${esc(s.nota)}</p></section>` : ''}</div>`;
}
function pickerForm() {
  const s = K.st(), ja = K.rot(s, ui.kDia, ui.kPer).map(x => x.prodId), ps = Produtos.lista('pele');
  const lista = catsDe('pele').map(c => { const xs = ps.filter(p => p.cat === c); if (!xs.length) return '';
    return `<p class="grp-title">${CATS[c][0]}</p><div class="picklist">${xs.map(p => `<button class="pick" data-act="kAddProd" data-id="${p.id}">${pimg(p, 40)}<span class="grow">${esc(p.nome)}${p.marca ? ` <span class="muted sm">· ${esc(p.marca)}</span>` : ''}</span>${ja.includes(p.id) ? '<small>já na rotina</small>' : ic('plus')}</button>`).join('')}</div>`; }).join('');
  return `${lista || '<p class="muted sm">Sua coleção ainda não tem produtos de pele.</p>'}<button class="btn ghost" data-act="kNovoProd">${ic('plus')} Cadastrar novo produto</button>`;
}
const addStep = prodId => { const s = K.st(); K.ensure(s, ui.kDia, ui.kPer).push({id: uid(), prodId, obs: ''}); K.save(s); ui.kEdit = true; };

App.module({
  id: 'skincare', nav: {route: 'pele', label: 'Pele', icon: 'drop', area: 'beleza'},

    kRotina: () => { K.save(aplicarRotinaPele(K.st())); toast('Sua rotina de skincare foi aplicada'); },
    kRotinaConfirmar: () => Sheet.confirm({title: 'Aplicar sua rotina?', text: 'As rotinas de manhã e noite dos 7 dias serão trocadas pela sua rotina. Os produtos da coleção e o que você já marcou continuam.', ok: 'Aplicar', onOk: () => App.actions.kRotina()}),
    kNota: () => Sheet.open({title: 'Cuidados importantes', state: {nota: K.st().nota || ''}, render: st => `<textarea class="t" id="kn-nota" data-bind="nota" rows="6">${esc(st.nota)}</textarea><button class="btn primary" data-act="kNotaSalvar">Salvar</button>`}),
    kNotaSalvar: () => { const s = K.st(); s.nota = (Sheet.st.nota || '').trim(); K.save(s); Sheet.close(); },
    kZero: () => Store.put('skincare', {v: 1, rotinas: {}, checks: {}}),
    kExOk: () => { const s = K.st(); s.exemplo = false; K.save(s); },
    kCheck: d => {
      const s = K.st(); s.checks = s.checks || {};

      const i = arr.indexOf(d.id);
      if (i >= 0) arr.splice(i, 1); else { arr.push(d.id); buzz(12); }
      const lim = new Date(); lim.setDate(lim.getDate() - 120); const lk = dkey(lim);
      Object.keys(s.checks).forEach(k => { if (k < lk) delete s.checks[k]; });
      K.save(s);
      const g = K.prog(s, fromKey(d.k).getDay(), d.k, d.per);
      if (i < 0 && g.t && g.f === g.t) toast(`Rotina da ${PER[d.per][0].toLowerCase()} completa`);
    },
    kTudo: d => {
      const s = K.st(); s.checks = s.checks || {};
      const day = s.checks[d.k] = s.checks[d.k] || {manha: [], noite: []};
      day[ui.kPer] = K.rot(s, ui.kDia, ui.kPer).map(x => x.id); K.save(s); buzz(20);
      toast(`Rotina da ${PER[ui.kPer][0].toLowerCase()} completa`);
    },
    kMove: ({from, to}) => { const s = K.st(), v = K.rot(s, ui.kDia, ui.kPer); mover(v, from, to); s.rotinas[ui.kDia][ui.kPer] = v; K.save(s); },
    kDel: d => { const s = K.st(), a = K.ensure(s, ui.kDia, ui.kPer), i = a.findIndex(x => x.id === d.id); if (i >= 0) a.splice(i, 1); K.save(s); toast('Etapa removida da rotina'); },
    kStepEdit: d => {
      const s = K.st(), x = K.ensure(s, ui.kDia, ui.kPer).find(y => y.id === d.id), p = Produtos.get(x.prodId);
      Sheet.open({title: p.nome, state: {id: x.id, obs: x.obs || ''}, render: st => `
        <label class="f">Observação só para esta etapa<textarea class="t" id="fs-obs" data-bind="obs" rows="2" placeholder="${esc(p.obs || 'Ex.: só na zona T')}">${esc(st.obs)}</textarea></label>
        <p class="muted sm">Se ficar vazio, aparece a observação do produto.</p>
        <button class="btn primary" data-act="kStepSalvar">Salvar</button>`});
    },
    kStepSalvar: () => { const s = K.st(), x = K.ensure(s, ui.kDia, ui.kPer).find(y => y.id === Sheet.st.id); if (x) x.obs = (Sheet.st.obs || '').trim(); K.save(s); Sheet.close(); },
    kAdd: () => Sheet.open({title: `${PER[ui.kPer][0]} · ${DIA_LONGO[ui.kDia]}`, render: pickerForm, state: {}}),
    kAddProd: d => { addStep(d.id); Sheet.close(); toast('Produto adicionado à rotina'); },
    kNovoProd: () => abrirProduto({tipo: 'pele'}, {title: 'Novo produto de pele', okLabel: 'Salvar e adicionar', onSave: p => { if ((CATS[p.cat] || [])[1] === 'pele') { addStep(p.id); toast('Produto criado e adicionado'); } else toast('Produto salvo na coleção'); }}),
    kCopiar: () => Sheet.open({title: 'Copiar rotina', state: {dias: [], ambos: false}, render: st => `
      <p class="muted sm">Copia a rotina da ${PER[ui.kPer][0].toLowerCase()} de ${DIA_LONGO[ui.kDia]} para os dias escolhidos. A rotina que já existe nesses dias será substituída.</p>
      <div class="chips wrap">${ORDEM_SEMANA.filter(d => d !== ui.kDia).map(d => `<button class="chip" aria-pressed="${st.dias.includes(d)}" data-act="kCopDia" data-d="${d}">${DIA_CURTO[d]}</button>`).join('')}
        <button class="chip" data-act="kCopTodos">Todos</button></div>
      <button class="pick" role="checkbox" aria-checked="${st.ambos}" data-act="kCopAmbos"><span class="box sq">${ic('check')}</span>Copiar manhã e noite</button>
      ${st.err ? `<p class="note warn">${esc(st.err)}</p>` : ''}
      <button class="btn primary" data-act="kCopOk">Copiar</button>`}),
    kCopDia: d => { const a = Sheet.st.dias, n = +d.d, i = a.indexOf(n); i >= 0 ? a.splice(i, 1) : a.push(n); Sheet.refresh(); },
    kCopTodos: () => { Sheet.st.dias = ORDEM_SEMANA.filter(d => d !== ui.kDia); Sheet.refresh(); },
    kCopAmbos: () => { Sheet.st.ambos = !Sheet.st.ambos; Sheet.refresh(); },
    kCopOk: () => {
      const st = Sheet.st, s = K.st();
      if (!st.dias.length) { st.err = 'Escolha pelo menos um dia.'; return Sheet.refresh(); }
      const pers = st.ambos ? ['manha', 'noite'] : [ui.kPer];
      st.dias.forEach(d => pers.forEach(p => { K.ensure(s, d, p); s.rotinas[d][p] = K.rot(s, ui.kDia, p).map(x => ({id: uid(), prodId: x.prodId, obs: x.obs})); }));
      K.save(s); Sheet.close(); toast(`Rotina copiada para ${plural(st.dias.length, 'dia')}`);
    }
  }
});
})();

/* =====================================================================
   MÓDULO CABELO
   doc "cabelo": {cronograma:['H','N','H','R'], intervalo, lavagens:[{id,data,trat,produtos,obs}], campos:[...]}
   docs "cabelo-evo-<id>": {id, data, foto, obs:{campo:texto}, nota}  (um por foto, para caber no limite)
   ===================================================================== */
(() => {
const TRAT = {H: ['Hidratação', 'Repõe água'], N: ['Nutrição', 'Repõe óleos'], R: ['Reconstrução', 'Repõe massa (queratina)'], L: ['Só lavagem', 'Sem tratamento']};
const CAMPOS = ['Brilho', 'Maciez', 'Porosidade', 'Frizz', 'Volume', 'Pontas', 'Resultado dos tratamentos'];
const ui = App.ui;
ui.cabView = ui.cabView || 'cuidados';

const C = {
  st: () => Store.get('cabelo'),
  base: () => C.st() || {v: 1, cronograma: ['H', 'N', 'H', 'R'], intervalo: 3, lavagens: [], campos: [...CAMPOS]},
  save: s => Store.put('cabelo', s),
  lav: s => [...s.lavagens].sort((a, b) => b.data.localeCompare(a.data) || (b.criado || 0) - (a.criado || 0)),
  proximo(s) {
    const feitos = s.lavagens.filter(l => l.trat !== 'L').length, seq = s.cronograma.length ? s.cronograma : ['H'];
    const ult = C.lav(s)[0], prox = ult ? fromKey(ult.data) : new Date();
    if (ult) prox.setDate(prox.getDate() + (s.intervalo || 3));
    return {trat: seq[feitos % seq.length], pos: feitos % seq.length, ult, data: prox};
  },
  evo: () => Store.ids('cabelo-evo-').map(k => Store.docs[k]).sort((a, b) => b.data.localeCompare(a.data))
};
App.hooks.usos.push(id => { const s = C.st(); if (!s) return []; const n = s.lavagens.filter(l => (l.produtos || []).includes(id)).length; return n ? [`${plural(n, 'registro')} de lavagem`] : []; });
App.hooks.removerProduto.push(id => { const s = C.st(); if (!s) return; s.lavagens.forEach(l => { l.produtos = (l.produtos || []).filter(x => x !== id); }); C.save(s); });

function home() {
  const s = C.st(); if (!s) return '';
  const p = C.proximo(s), hoje = fromKey(dkey()), dias = Math.round((p.data - hoje) / 864e5);
  return `<button class="item" data-act="go" data-r="cabelo">${ic('hair')}<span class="grow"><p class="eyebrow" style="margin:0">Próximo tratamento capilar</p>
    <h3>${TRAT[p.trat][0]} · ${dias <= 0 ? 'hoje' : dias === 1 ? 'amanhã' : `em ${dias} dias`}</h3></span>${ic('next')}</button>`;
}

function viewCabelo() {
  const s = C.base();
  const seg = `<div class="seg" role="group" aria-label="Cabelo" style="margin-bottom:14px">${[['cuidados', 'Cuidados'], ['evolucao', 'Minha evolução']].map(([k, l]) => `<button aria-pressed="${ui.cabView === k}" data-act="cabView" data-v="${k}">${l}</button>`).join('')}</div>`;
  if (!Store.ready && !C.st()) return seg + loadingCard();
  return seg + (ui.cabView === 'evolucao' ? viewEvolucao(s) : viewCuidados(s));
}
function viewCuidados(s) {
  const p = C.proximo(s), hoje = fromKey(dkey()), dias = Math.round((p.data - hoje) / 864e5), L = C.lav(s);
  const ult = p.ult ? Math.round((hoje - fromKey(p.ult.data)) / 864e5) : null;
  return `<div class="stack"><section class="card sage"><p class="eyebrow">Próximo tratamento</p><div class="next"><div class="tmark">${p.trat}</div>
      <div><h2>${TRAT[p.trat][0]}</h2><p class="sm muted">${dias <= 0 ? 'Pode ser hoje' : `Sugestão: ${DIA_LONGO[p.data.getDay()]}, ${fmtData(p.data)}`}${ult != null ? ` · última lavagem ${ult === 0 ? 'hoje' : ult === 1 ? 'ontem' : `há ${ult} dias`}` : ''}</p></div></div>
      <div class="between" style="margin-top:14px;flex-wrap:wrap"><div class="seq" aria-label="Cronograma">${(s.cronograma.length ? s.cronograma : ['H']).map((t, i) => `<span class="${i === p.pos ? 'cur' : ''}">${t}</span>`).join('')}</div>
      <button class="btn link sm" data-act="cabCrono">Ajustar cronograma</button></div>
      <button class="btn primary block" style="margin-top:12px" data-act="cabLavar">${ic('plus')} Registrar lavagem</button></section>
    <div class="section-t"><h2>Histórico de lavagens</h2><span class="tag">${plural(L.length, 'registro')}</span></div>
    ${L.length ? `<section class="card" style="padding-block:6px">${L.slice(0, ui.cabTodas ? L.length : 6).map(l => { const ps = (l.produtos || []).map(id => Produtos.get(id)).filter(Boolean);
      return `<button class="wash" data-act="cabLavEdit" data-id="${l.id}"><span class="tmark">${l.trat}</span><span class="grow"><span class="sm">${TRAT[l.trat][0]}</span>
        <p class="sm muted">${DIA_CURTO[fromKey(l.data).getDay()]}, ${fmtData(fromKey(l.data))}${ps.length ? ' · ' + esc(ps.map(x => x.nome).join(', ')) : ''}</p>${l.obs ? `<p class="obs">${esc(l.obs)}</p>` : ''}</span>${ic('pencil')}</button>`; }).join('')}</section>
      ${L.length > 6 ? `<button class="btn ghost block" data-act="cabTodas">${ui.cabTodas ? 'Mostrar menos' : 'Ver todas'}</button>` : ''}`
      : `<div class="card empty"><p class="muted sm">Registre a primeira lavagem para acompanhar o cronograma.</p></div>`}</div>`;
}
function viewEvolucao(s) {
  const E = C.evo();
  const intro = `<div class="between"><p class="sm muted grow">Seu diário fotográfico: registre como você percebe o cabelo, sem avaliações automáticas.</p></div>
    <div class="row-btns"><button class="btn primary" data-act="evoNovo">${ic('camera')} Nova foto</button>${E.length > 1 ? `<button class="btn sand" data-act="evoComparar">Comparar</button>` : ''}</div>`;
  if (!E.length) return `<div class="stack">${intro}<div class="card empty">${ic('camera')}<h2>Comece seu diário</h2><p class="muted sm">Adicione uma foto de hoje e anote brilho, maciez, frizz ou o que quiser observar.</p></div></div>`;
  let mes = '';
  const linhas = E.map(e => { const d = fromKey(e.data), m = d.toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'});
    const head = m !== mes ? `<p class="mes">${m.charAt(0).toUpperCase() + m.slice(1)}</p>` : ''; mes = m;
    const obs = Object.entries(e.obs || {}).filter(([, v]) => v);
    return `${head}<button class="entry" data-act="evoAbrir" data-id="${e.id}">${e.foto ? `<img class="ph" src="${esc(e.foto.url)}" alt="Foto do cabelo em ${fmtData(d)}" loading="lazy">` : `<span class="ph">${ic('hair')}</span>`}
      <span class="meta"><span class="date">${d.getDate()} de ${d.toLocaleDateString('pt-BR', {month: 'long'})}</span>
      ${obs.length ? `<span class="obsl">${obs.slice(0, 4).map(([k, v]) => `<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}${obs.length > 4 ? `<span class="muted">+${obs.length - 4}</span>` : ''}</span>` : ''}
      ${e.nota ? `<span class="obs">${esc(e.nota)}</span>` : ''}</span></button>`; }).join('');
  return `<div class="stack">${intro}<div class="diary">${linhas}</div></div>`;
}
function lavForm(st) {
  const ps = Produtos.lista('cabelo');
  return `<label class="f">Data<input class="t" id="cl-data" type="date" data-bind="data" value="${esc(st.data)}" max="${dkey()}"></label>
    <div class="f"><span>O que foi feito</span><div class="chips wrap">${Object.entries(TRAT).map(([k, [l]]) => `<button class="chip" aria-pressed="${st.trat === k}" data-act="clTrat" data-t="${k}">${l}</button>`).join('')}</div></div>
    <div class="f"><span>Produtos usados</span>${ps.length ? `<div class="picklist">${ps.map(p => `<button class="pick" role="checkbox" aria-checked="${st.produtos.includes(p.id)}" data-act="clProd" data-id="${p.id}"><span class="box sq">${ic('check')}</span>${pimg(p, 40)}<span class="grow">${esc(p.nome)}</span><small>${esc(CATS[p.cat][0])}</small></button>`).join('')}</div>` : '<p class="muted sm" style="font-weight:400">Nenhum produto de cabelo na coleção ainda.</p>'}
      <button class="btn link sm" data-act="clNovoProd">${ic('plus')} Cadastrar produto de cabelo</button></div>
    <label class="f">Observações<textarea class="t" id="cl-obs" data-bind="obs" rows="2" placeholder="Como ficou, o que sentiu…">${esc(st.obs)}</textarea></label>
    <div class="row-btns">${st.id ? `<button class="btn danger" data-act="clExcluir">Excluir</button>` : ''}<button class="btn primary" data-act="clSalvar">Salvar</button></div>`;
}
function evoForm(st) {
  const s = C.base();
  return `<div class="f"><span>Foto</span><div class="photo-field"><div class="pimg" style="width:96px;height:120px">${st.foto ? `<img src="${esc(st.foto.url)}" alt="">` : ic('hair')}</div>
    <div class="row" style="flex-wrap:wrap"><button class="btn sm ghost" data-act="fotoPick" ${st.enviando ? 'disabled' : ''}>${ic('camera')} ${st.enviando ? 'Enviando…' : st.foto ? 'Trocar foto' : 'Escolher foto'}</button>${st.foto ? `<button class="btn sm link" data-act="fotoTirar">Remover</button>` : ''}</div></div></div>
    <label class="f">Data<input class="t" id="ce-data" type="date" data-bind="data" value="${esc(st.data)}" max="${dkey()}"></label>
    <p class="muted sm">Preencha só o que quiser.</p>
    ${s.campos.map((c, i) => `<label class="f">${esc(c)}<input class="t" id="ce-c${i}" data-bind="c_${i}" value="${esc(st['c_' + i] || '')}" maxlength="120"></label>`).join('')}
    <label class="f">Anotação livre<textarea class="t" id="ce-nota" data-bind="nota" rows="2">${esc(st.nota)}</textarea></label>
    <button class="btn link sm" data-act="evoCampos">Personalizar campos</button>
    ${st.err ? `<p class="note warn">${esc(st.err)}</p>` : ''}
    <div class="row-btns">${st.id ? `<button class="btn danger" data-act="evoExcluir">Excluir</button>` : ''}<button class="btn primary" data-act="evoSalvar">Salvar no diário</button></div>`;
}
function openEvo(e) {
  const s = C.base(), st = {id: e ? e.id : null, data: e ? e.data : dkey(), foto: e ? e.foto : null, fotoOriginal: e ? e.foto : null, nota: e ? e.nota || '' : ''};
  s.campos.forEach((c, i) => { st['c_' + i] = e && e.obs ? e.obs[c] || '' : ''; });
  Sheet.open({title: e ? 'Editar registro' : 'Nova foto do cabelo', state: st, render: evoForm});
}
function cmpView(st) {
  const E = C.evo(), a = E.find(x => x.id === st.a), b = E.find(x => x.id === st.b);
  const sel = (k, v) => `<select class="t" id="cmp-${k}" data-chg="evoSel" data-k="${k}">${E.map(e => `<option value="${e.id}" ${e.id === v ? 'selected' : ''}>${fmtData(fromKey(e.data))} ${fromKey(e.data).getFullYear()}</option>`).join('')}</select>`;
  const fig = e => `<figure>${e.foto ? `<img src="${esc(e.foto.url)}" alt="">` : `<span class="ph">${ic('hair')}</span>`}<figcaption>${fmtData(fromKey(e.data))}</figcaption>
    <div class="obsl">${Object.entries(e.obs || {}).filter(([, v]) => v).map(([k, v]) => `<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div></figure>`;
  const dias = a && b ? Math.abs(Math.round((fromKey(b.data) - fromKey(a.data)) / 864e5)) : 0;
  return `<div class="grid2">${sel('a', st.a)}${sel('b', st.b)}</div><p class="sm muted" style="text-align:center">${plural(dias, 'dia')} entre as fotos</p><div class="cmp">${a ? fig(a) : ''}${b ? fig(b) : ''}</div>`;
}

App.module({
  id: 'cabelo', nav: {route: 'cabelo', label: 'Cabelo', icon: 'hair', area: 'beleza'},
  routes: {cabelo: viewCabelo}, home,
  actions: {
    cabView: d => { ui.cabView = d.v; App.render(); },
    cabTodas: () => { ui.cabTodas = !ui.cabTodas; App.render(); },
    cabCrono: () => { const s = C.base(); Sheet.open({title: 'Cronograma capilar', state: {seq: [...s.cronograma], intervalo: s.intervalo || 3}, render: st => `
      <p class="muted sm">Monte a sequência de tratamentos. "Só lavagem" não avança o cronograma.</p>
      <div class="seq">${st.seq.map((t, i) => `<span class="cur" title="${TRAT[t][0]}">${t}</span>`).join('') || '<span class="muted sm">Vazio</span>'}</div>
      <div class="row-btns">${['H', 'N', 'R'].map(t => `<button class="btn sm sand" data-act="crAdd" data-t="${t}">+ ${TRAT[t][0]}</button>`).join('')}</div>
      <button class="btn sm ghost" data-act="crTirar" ${st.seq.length ? '' : 'disabled'}>Remover o último</button>
      <label class="f">Lavar a cada (dias)<input class="t" id="cr-int" type="number" inputmode="numeric" min="1" max="14" data-bind="intervalo" value="${esc(st.intervalo)}"></label>
      <button class="btn primary" data-act="crSalvar">Salvar cronograma</button>`}); },
    crAdd: d => { Sheet.st.seq.push(d.t); Sheet.refresh(); },
    crTirar: () => { Sheet.st.seq.pop(); Sheet.refresh(); },
    crSalvar: () => { const s = C.base(); s.cronograma = Sheet.st.seq.length ? Sheet.st.seq : ['H']; s.intervalo = Math.min(14, num(Sheet.st.intervalo, 3, 1)); C.save(s); Sheet.close(); toast('Cronograma salvo'); },
    cabLavar: () => { const s = C.base(); Sheet.open({title: 'Registrar lavagem', state: {data: dkey(), trat: C.proximo(s).trat, produtos: [], obs: ''}, render: lavForm}); },
    cabLavEdit: d => { const l = C.base().lavagens.find(x => x.id === d.id); Sheet.open({title: 'Editar lavagem', state: {...clone(l), produtos: [...(l.produtos || [])]}, render: lavForm}); },
    clTrat: d => { Sheet.st.trat = d.t; Sheet.refresh(); },
    clProd: d => { const a = Sheet.st.produtos, i = a.indexOf(d.id); i >= 0 ? a.splice(i, 1) : a.push(d.id); Sheet.refresh(); },
    clNovoProd: () => { const back = clone(Sheet.st); abrirProduto({tipo: 'cabelo'}, {title: 'Novo produto de cabelo', okLabel: 'Salvar e voltar',
      onSave: p => { back.produtos.push(p.id); Sheet.open({title: back.id ? 'Editar lavagem' : 'Registrar lavagem', state: back, render: lavForm}); }}); },
    clSalvar: () => {
      const st = Sheet.st, s = C.base();
      const l = {id: st.id || uid(), data: st.data || dkey(), trat: st.trat, produtos: st.produtos, obs: (st.obs || '').trim(), criado: st.criado || Date.now()};
      const i = s.lavagens.findIndex(x => x.id === l.id);
      if (i >= 0) s.lavagens[i] = l; else s.lavagens.push(l);
      C.save(s); Sheet.close(); toast('Lavagem registrada');

/* =====================================================================

(() => {
const D = {st: () => Store.get('desejos') || {v: 1, itens: []}, save: s => Store.put('desejos', s)};
const fmtPreco = v => v ? fmtBRL(v) : '', parsePreco = parseValor;
const linkOk = s => { try { const u = new URL(s); return /^https?:$/.test(u.protocol) ? u.href : ''; } catch (e) { return ''; } };
const host = s => { try { return new URL(s).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };

function card(x) {

    },

    deParaColecao: d => {

    }

})();

/* =====================================================================
   MÓDULO CONTAS (financeiro)
   doc "financas": {contas:[{id,serie,nome,valor,venc:'AAAA-MM-DD',cat,recorrente,pago,pagoEm,obs}]}
   Conta que repete todo mês: ao marcar como paga, a do mês seguinte é criada sozinha.
   ===================================================================== */
(() => {
const ui = App.ui;
ui.cMes = ui.cMes || 0;
const CAT = {moradia: 'Moradia', casa: 'Água, luz e gás', internet: 'Internet e celular', cartao: 'Cartão de crédito', assinaturas: 'Assinaturas',
  saude: 'Saúde', educacao: 'Educação', transporte: 'Transporte', impostos: 'Impostos e taxas', outros: 'Outros'};
const F = {st: () => Store.get('financas') || {v: 1, contas: []}, save: s => Store.put('financas', s)};
const proxMes = k => { const d = fromKey(k), dia = d.getDate(), n = new Date(d.getFullYear(), d.getMonth() + 1, 1);
  n.setDate(Math.min(dia, new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate())); return dkey(n); };
function status(c) {
  if (c.pago) return ['ok', `Paga${c.pagoEm ? ' em ' + fmtData(new Date(c.pagoEm)) : ''}`];
  const n = diasAte(c.venc);
  if (n < 0) return ['late', `Vencida há ${plural(-n, 'dia')}`];
  if (n === 0) return ['late', 'Vence hoje'];
  if (n === 1) return ['soon', 'Vence amanhã'];
  if (n <= 5) return ['soon', `Vence em ${n} dias`];
  return ['', `Vence ${fmtData(fromKey(c.venc))}`];
}
const abertas = s => s.contas.filter(c => !c.pago).sort((a, b) => a.venc.localeCompare(b.venc));

function home() {
  const s = F.st(), ab = abertas(s);
  if (!s.contas.length) return `<button class="item" data-act="go" data-r="contas">${ic('wallet')}<span class="grow"><p class="eyebrow" style="margin:0">Contas</p><h3>Cadastre suas contas e acompanhe os vencimentos</h3></span>${ic('next')}</button>`;
  if (!ab.length) return `<button class="item" data-act="go" data-r="contas">${ic('wallet')}<span class="grow"><p class="eyebrow" style="margin:0">Contas</p><h3>Tudo pago por enquanto</h3></span>${ic('next')}</button>`;
  const c = ab[0], [cls, txt] = status(c), atrasadas = ab.filter(x => diasAte(x.venc) < 0).length;
  return `<button class="item" data-act="go" data-r="contas" style="align-items:flex-start">${ic('wallet')}<span class="grow"><p class="eyebrow" style="margin:0">Próxima conta</p>
    <div class="between"><h3>${esc(c.nome)}</h3><span class="money">${fmtBRL(c.valor)}</span></div>
    <p class="row" style="gap:8px;margin-top:4px;flex-wrap:wrap"><span class="chip-st ${cls}">${txt}</span><span class="sm muted">${fmtData(fromKey(c.venc))}</span>${atrasadas > (diasAte(c.venc) < 0 ? 1 : 0) ? `<span class="chip-st late">${plural(atrasadas, 'vencida')}</span>` : ''}</p></span></button>`;
}

function viewContas() {

  const mk = `${ref.getFullYear()}-${pad(ref.getMonth() + 1)}`, doMes = s.contas.filter(c => c.venc.startsWith(mk)).sort((a, b) => (a.pago - b.pago) || a.venc.localeCompare(b.venc));
  const total = doMes.reduce((a, c) => a + (c.valor || 0), 0), pago = doMes.filter(c => c.pago).reduce((a, c) => a + (c.valor || 0), 0);
  const vencidas = abertas(s).filter(c => diasAte(c.venc) < 0 && !c.venc.startsWith(mk));
  const nomeMes = ref.toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'});
  return `<header class="top"><div><p class="eyebrow">Financeiro</p><h1>Contas</h1></div><div class="row" style="gap:6px"><button class="btn sm ghost" data-act="cImportar">Importar</button><button class="btn sm primary" data-act="cNova">${ic('plus')} Conta</button></div></header>
    <div class="stack"><section class="card"><div class="cal-nav"><button class="icon-btn sm" data-act="cMes" data-d="-1" aria-label="Mês anterior">${ic('back')}</button>
      <h3 style="text-transform:capitalize">${nomeMes}</h3><button class="icon-btn sm" data-act="cMes" data-d="1" aria-label="Próximo mês">${ic('next')}</button></div>
      <div class="sum-grid" style="margin-top:14px"><div><b style="font-size:1.25rem">${fmtBRL(total)}</b><span>total do mês</span></div><div><b style="font-size:1.25rem;color:var(--ok)">${fmtBRL(pago)}</b><span>pago</span></div><div><b style="font-size:1.25rem">${fmtBRL(total - pago)}</b><span>a pagar</span></div></div>
      ${total ? `<div class="bar" style="margin-top:12px"><i style="width:${Math.round(pago * 100 / total)}%"></i></div>` : ''}</section>
    ${vencidas.length ? `<button class="note warn" style="border:0;text-align:left;cursor:pointer;font:inherit" data-act="cIrVencida">${plural(vencidas.length, 'conta vencida', 'contas vencidas')} de outros meses · toque para ver</button>` : ''}
    ${doMes.length ? `<section class="card" style="padding-block:6px"><div class="steps">${doMes.map(c => { const [cls, txt] = status(c);
      return `<div class="step" style="grid-template-columns:auto 1fr auto;cursor:default"><button class="box" role="checkbox" aria-checked="${c.pago}" aria-label="Marcar ${esc(c.nome)} como paga" data-act="cPagar" data-id="${c.id}">${ic('check')}</button>
        <button style="all:unset;cursor:pointer;min-width:0" data-act="cEditar" data-id="${c.id}"><p class="nome" style="${c.pago ? 'color:var(--muted)' : ''}">${esc(c.nome)}</p>

        <span class="money" style="${c.pago ? 'color:var(--muted)' : ''}">${fmtBRL(c.valor)}</span></div>`; }).join('')}</div></section>`
      : `<div class="card empty">${ic('wallet')}<h2>Nenhuma conta em ${ref.toLocaleDateString('pt-BR', {month: 'long'})}</h2><p class="muted sm">Cadastre aluguel, cartão, luz, internet… Contas que se repetem todo mês aparecem sozinhas no mês seguinte quando você marcar como paga.</p></div>`}
    </div>`;
}
function form(st) {
  return `<label class="f">Nome da conta<input class="t" id="cf-nome" data-bind="nome" value="${esc(st.nome)}" placeholder="Ex.: Cartão Nubank, Luz, Aluguel" maxlength="50"></label>

const CAT_PALAVRAS = [[/luz|energia|enel|light|cemig|água|agua|sabesp|cedae|gás|gas\b|comgás/i, 'casa'], [/internet|celular|telefone|claro|vivo|tim\b|oi\b|net\b|fibra/i, 'internet'],

  [/faculdade|curso|escola|mensalidade|ingl[eê]s/i, 'educacao'], [/ipva|iptu|imposto|taxa|das\b|inss/i, 'impostos'], [/gasolina|combust|uber|99|carro|seguro auto|estacionamento|ônibus|onibus/i, 'transporte']];
function lerContas(txt) {
  const hoje = new Date(), out = [];
  String(txt || '').split(/\r?\n/).forEach(l => {
    const corte = l.indexOf('//'), obs = corte >= 0 ? l.slice(corte + 2).trim() : '';
    let resto = (corte >= 0 ? l.slice(0, corte) : l).replace(/"/g, ' ').trim(), venc = null, m;
    if (!resto) return;
    if ((m = resto.match(/(\d{4})-(\d{2})-(\d{2})/))) { venc = `${m[1]}-${m[2]}-${m[3]}`; resto = resto.replace(m[0], ' '); }
    if (!venc && (m = resto.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) { let y = m[3] ? +m[3] : hoje.getFullYear(); if (y < 100) y += 2000; venc = dkey(new Date(y, +m[2] - 1, +m[1])); resto = resto.replace(m[0], ' '); }
    if (!venc && (m = resto.match(/\bdia\s*(\d{1,2})\b/i))) { const fim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate(); venc = dkey(new Date(hoje.getFullYear(), hoje.getMonth(), Math.min(+m[1], fim))); resto = resto.replace(m[0], ' '); }

    if (!nome) return;

        <p class="muted sm">Ao apagar uma seção, as tarefas dela continuam, só ficam sem seção.</p>`; }}),
    tfSecAdd: () => { const st = Sheet.st, nome = (st.nova || '').trim(), s = D.st(); if (!nome) return;
      if (s.secoes.some(c => c.nome.toLowerCase() === nome.toLowerCase())) return toast('Essa seção já existe');
      const c = {id: uid(), nome}; s.secoes.push(c); D.save(s); ui.tfSec = c.id; st.nova = ''; Sheet.refresh(); toast(`Seção ${nome} criada`); },
    tfSecDel: d => { const s = D.st(); s.secoes = s.secoes.filter(c => c.id !== d.id); s.itens.forEach(x => { if (x.sec === d.id) x.sec = ''; }); if (ui.tfSec === d.id) ui.tfSec = 'todas'; D.save(s); Sheet.refresh(); },
    tfVerFeitos: () => { ui.tfFeitos = !ui.tfFeitos; App.render(); },
    tfCheck: d => { const s = D.st(), x = s.itens.find(y => y.id === d.id); x.feito = !x.feito; x.feitoEm = x.feito ? Date.now() : null;
      if (x.feito) { buzz(12); const n = proxima(x); if (n && !s.itens.some(y => !y.feito && y.titulo === n.titulo && y.data === n.data)) s.itens.push(n); }
      D.save(s); },
    tfEdit: d => { const x = D.st().itens.find(y => y.id === d.id); Sheet.open({title: 'Tarefa', render: form, state: clone(x)}); },
    tfRep: d => { Sheet.st.rep = d.r; Sheet.refresh(); },
    tfSalvar: () => { const st = Sheet.st, s = D.st(), titulo = (st.titulo || '').trim();
      if (!titulo) { st.err = 'Escreva a tarefa.'; return Sheet.refresh(); }
      if (st.rep !== 'nao' && !st.data) { st.err = 'Para repetir, escolha uma data.'; return Sheet.refresh(); }
      const i = s.itens.findIndex(y => y.id === st.id);
      s.itens[i] = {...s.itens[i], titulo, nota: (st.nota || '').trim(), data: st.data || '', hora: st.data ? st.hora || '' : '', rep: st.rep || 'nao', sec: st.sec || ''};
      D.save(s); Sheet.close(); toast('Tarefa salva'); },
    tfLembrar: () => { const st = Sheet.st; if (!st.data) { st.err = 'Escolha a data (e o horário) para criar o lembrete.'; return Sheet.refresh(); }
      lembreteCalendario({id: 'tarefa-' + st.id + '-' + st.data, titulo: (st.titulo || '').trim() || 'Tarefa', nota: st.nota, quando: quando(st)}); },
    tfExcluir: () => { const id = Sheet.st.id; const s = D.st(); s.itens = s.itens.filter(y => y.id !== id); D.save(s); Sheet.close(); toast('Tarefa excluída'); },
    tfLimpar: () => Sheet.confirm({title: 'Apagar concluídas?', text: 'As tarefas já concluídas serão apagadas.', ok: 'Apagar', danger: true, onOk: () => { const s = D.st(); s.itens = s.itens.filter(y => !y.feito); D.save(s); }})
  }
});
})();

/* ---------- início ---------- */
App.routes.hoje = {mod: {id: 'home'}, view: viewHome};
Store.on(() => App.queue());
window.addEventListener('hashchange', () => App.render());
Store.boot().then(() => {
  App.render();
  Store.connect();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
  // versão site: funciona offline (no Claude o service worker não existe e a chamada falha em silêncio)
  try { if ('serviceWorker' in navigator && !window.claude && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
});
})();
</script>
